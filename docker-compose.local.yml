#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml run --rm --no-deps dcm-seed-dbc
#   docker compose -f docker-compose.local.yml --profile sink --profile ui up -d --build
#
# The default set is the MF4 pipeline plus the Test Manager registry: MF4 Import on
# http://localhost:18400, the decoder, tm-connector (status on http://localhost:18500/status),
# the Test Manager API on http://localhost:18200 (bearer local-ingest-token) and the planning
# mock. `--profile sink` adds the catalog-less lake sink; `--profile ui` adds the Test Manager
# frontend on http://localhost:18300.
#
# There is no QuixLake here, so the statistics DETAIL screens answer 503 honestly; the run,
# file and signal screens work, on the numbers the ingestion pipeline measured and the
# connector posted.

# Every app that calls the Configuration Manager presents this; any non-empty value works
# locally because portal-auth-stub grants whatever it is asked about.
x-sdk-token: &sdk_token "${Quix__Sdk__Token:-local-config-token}"

# The lake table, written once. In the cloud this is the ONE LAKE_TABLE project variable the
# sink writes and tm-connector, the API and the frontend read; compose has no project
# variables, so this anchor plays that role and cannot drift apart.
x-lake-table: &lake_table mf4_signals_local

# The two halves of that table's partition tree. The sink writes ONE hive order
# (`HIVE_COLUMNS`); the Test Manager's two pickers read it split in two — the sessions dialog
# walks the address of a session, the Explorer walks what is inside one. Written here once so
# the split cannot drift from the order the sink writes.
x-lake-session-partitions: &lake_session_partitions platform,work_order,test_definition,run_id
x-lake-data-partitions: &lake_data_partitions ~channel_name,~sender_node,~frame_name,~signal

# Rung 3 of the run-key ladder. ONE value, read by the decoder and the connector: a difference
# between them puts a file's catalogue under one run and its samples under another.
x-run-key-pattern: &run_key_pattern "TAS-\\d+"

# The Test Manager bearer. Any value works locally; every /api/v1 route needs it.
x-tm-token: &tm_token "${TM_API_TOKEN:-local-ingest-token}"

# One bucket for import (write) and decoder (read); the inner defaults hold no braces because
# compose ends a ${VAR:-default} at the first `}`.
x-blob-connection: &blob_connection >-
  {"provider": "Minio", "S3Compatible": {"BucketName": "${BLOB_BUCKET:-mf4-local-blob}",
  "AccessKeyId": "${BLOB_USER:-minioadmin}", "SecretAccessKey": "${BLOB_PASSWORD:-minioadmin}",
  "ServiceUrl": "http://blob:9000"}}

services:
  # --- the broker ------------------------------------------------------------
  # Internal listener only: inspect with `exec redpanda rpk topic list`.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- local object storage --------------------------------------------------
  # Pinned releases, not `latest`: both MinIO images have moved under the platform before.
  blob:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BLOB_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${BLOB_PASSWORD:-minioadmin}
    volumes:
      - blob-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One shot: quixportal opens the bucket but never creates it, so the first upload 404s
  # without this.
  blob-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      blob:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://blob:9000 ${BLOB_USER:-minioadmin} ${BLOB_PASSWORD:-minioadmin} &&
      mc mb local/${BLOB_BUCKET:-mf4-local-blob} --ignore-existing &&
      echo 'the blob bucket is ready'
      "
    restart: "no"

  # --- Dynamic Configuration -------------------------------------------------
  # quixportal's Auth guards every DCM route (and mf4-to-blob's write routes) with one
  # GET /auth/permissions/query against the Portal; there is no Portal here, so this grants
  # everything.
  portal-auth-stub:
    image: python:3.13-slim
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", "2")
                self.end_headers()
                self.wfile.write(b"{}")

            def log_message(self, *args):
                pass

        HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/auth/permissions/query')\""]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 2s

  # One Mongo, two databases: `quix` holds the configurations, `test_manager` the registry.
  # The same split the cloud runs, so a local document keys exactly as a deployed one.
  mongodb:
    image: mongo:8.0.5
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # The real Dynamic Configuration Manager: dcm-seed-dbc's write path and the producer of the
  # topic the decoder and the sink join on. Point DYNAMIC_CONFIG_PATH at a checkout of it.
  config-api-svc:
    build:
      context: ${DYNAMIC_CONFIG_PATH:-../Quix.DynamicConfiguration/backend}
      # Its own Dockerfile bases on python:3.12 while pyproject asks >=3.13, so uv fetches
      # CPython 3.14 and dies on rocksdict (no cp314 wheel); 3.13 + no downloads is the fix
      # until that repo is fixed.
      dockerfile_inline: |
        FROM python:3.13-slim-bookworm
        ENV DEBIAN_FRONTEND=noninteractive \
            PYTHONUNBUFFERED=1 \
            PYTHONIOENCODING=UTF-8 \
            UV_COMPILE_BYTECODE=1 \
            UV_PYTHON_DOWNLOADS=never
        WORKDIR /app
        COPY --from=ghcr.io/astral-sh/uv:0.9.5 /uv /uvx /bin/
        COPY . /app
        RUN uv sync --frozen --no-cache
        ENTRYPOINT ["/app/run", "--host", "0.0.0.0"]
    # These mirror quix.yaml's Configuration Manager `configuration:` block, so local documents
    # key exactly as the cloud's.
    environment:
      PORT: "80"
      Quix__Workspace__Id: "${Quix__Workspace__Id:-local}"
      # Platform-injected in the cloud; unset here means every WRITE answers 500 while reads
      # stay green.
      Quix__Portal__Api: "${Quix__Portal__Api:-http://portal-auth-stub:8000}"
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_USER: admin
      MONGO_PASSWORD: admin
      MONGO_DATABASE: quix
      MONGO_COLLECTION: configuration-api
      KAFKA_BROKER_ADDRESS: redpanda:9092
      KAFKA_TOPIC: config-updates
      KAFKA_CONSUMER_GROUP: config_api_local
    healthcheck:
      # The root, because this service mounts Swagger at `/`; uvicorn answers only once both
      # Mongo stores are open.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/')\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      portal-auth-stub:
        condition: service_healthy

  # --- the pipeline apps -----------------------------------------------------
  # `Quix__Broker__Address` is how quixstreams reaches a broker with no SDK token; every topic
  # name is spelled exactly as quix.yaml spells it, since a mismatch here is two silent topics.
  mf4-to-blob:
    mem_limit: 2000m
    build:
      context: ./mf4-to-blob
      # NOT `dockerfile: dockerfile`. The app's own dockerfile copies from the `git` build
      # context, which is the Quix builder's and does not exist here; this is the same recipe
      # against the app directory. The deployed image is the repo's dockerfile, untouched.
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONUNBUFFERED=1 PYTHONIOENCODING=UTF-8
        WORKDIR /app
        COPY requirements.txt ./
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 80
        ENTRYPOINT ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "80"]
    ports: ["18400:80"]
    environment:
      Quix__Broker__Address: redpanda:9092
      Quix__BlobStorage__Connection__Json: *blob_connection
      Quix__Workspace__Id: "${Quix__Workspace__Id:-local}"
      # The upload routes validate the CALLER's bearer token through quixportal; without this
      # they answer 503.
      Quix__Portal__Api: http://portal-auth-stub:8000
      output: mf4_metadata
      blob_prefix: mf4-uploads/
      collision_policy: reject
    depends_on:
      redpanda: {condition: service_healthy}
      blob-setup: {condition: service_completed_successfully}
      portal-auth-stub: {condition: service_healthy}

  mf4-decoder:
    mem_limit: 3000m
    build:
      context: ./mf4-decoder
      # See mf4-to-blob above: the app's dockerfile copies from the Quix `git` context.
      dockerfile_inline: |
        FROM python:3.12-slim-bullseye
        ENV DEBIAN_FRONTEND=noninteractive PYTHONUNBUFFERED=1 PYTHONIOENCODING=UTF-8
        WORKDIR /app
        COPY requirements.txt ./
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        ENTRYPOINT ["python3", "main.py"]
    environment:
      Quix__Broker__Address: redpanda:9092
      Quix__BlobStorage__Connection__Json: *blob_connection
      Quix__Workspace__Id: "${Quix__Workspace__Id:-local}"
      # join_lookup fetches each config version's content over HTTP, and an untokened fetch
      # is refused.
      Quix__Sdk__Token: *sdk_token
      input: mf4_metadata
      output: mf4-to-msg
      config: config-updates
      DBC_SOURCE: dcm
      TM_RUN_KEY_PATTERN: *run_key_pattern
      LOGLEVEL: INFO
    depends_on:
      redpanda: {condition: service_healthy}
      blob-setup: {condition: service_completed_successfully}
      config-api-svc: {condition: service_healthy}

  # One shot: fills Dynamic Configuration with the CAN databases the decoder resolves against.
  #   docker compose -f docker-compose.local.yml run --rm --no-deps dcm-seed-dbc
  dcm-seed-dbc:
    mem_limit: 500m
    build:
      context: ./dcm-seed-dbc
      dockerfile: dockerfile
    profiles: ["seed"]
    environment:
      CONFIG_API_URL: http://config-api-svc
      Quix__Sdk__Token: *sdk_token
    depends_on:
      config-api-svc: {condition: service_healthy}

  # One sink, one topic, one table - the catalog-less local twin of the deployment.
  mf4-datalake-sink:
    mem_limit: 3000m
    build:
      context: ./mf4-datalake-sink
      dockerfile: dockerfile
    profiles: ["sink"]   # catalog-less locally: writes parquet to minio, no Iceberg registration
    environment:
      Quix__Broker__Address: redpanda:9092
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      Quix__BlobStorage__Connection__Json: *blob_connection
      Quix__Workspace__Id: "${Quix__Workspace__Id:-local}"
      # join_lookup fetches each WorkOrder configuration's content over HTTP for the platform
      # fallback.
      Quix__Sdk__Token: *sdk_token
      input: mf4-to-msg
      config: config-updates
      TABLE_NAME: *lake_table
      HIVE_COLUMNS: platform,work_order,test_definition,run_id,~channel_name,~sender_node,~frame_name,~signal
      CONSUMER_GROUP: mf4_signals_local_v1
      BATCH_SIZE: "30"
      MAX_WRITE_WORKERS: "20"
      AUTO_DISCOVER: "false"
    depends_on:
      redpanda: {condition: service_healthy}

  # --- the Test Manager ------------------------------------------------------
  tm-api:
    mem_limit: 1000m
    build: ./api
    ports: ["18200:8000"]
    environment:
      # One Mongo, two databases: the registry lives beside the configurations.
      MONGO_URL: mongodb://admin:admin@mongodb:27017
      TM_API_TOKEN: *tm_token
      TM_ENV: development
      PLANNING_API_URL: http://mock-planning:8003
      # Every new or changed work order is pushed to the Configuration Manager as a WorkOrder
      # configuration; the lake sink reads its `project` as the platform fallback.
      CONFIG_API_URL: http://config-api-svc
      Quix__Sdk__Token: *sdk_token
      TM_LAKE_TABLE: *lake_table
      MF4_IMPORT_URL: http://mf4-to-blob/upload/direct
    depends_on:
      mongodb: {condition: service_healthy}
      config-api-svc: {condition: service_healthy}

  mock-planning:
    mem_limit: 300m
    build: ./api
    command: uvicorn mock_planning.main:app --host 0.0.0.0 --port 8003
    environment:
      MONGO_URL: mongodb://admin:admin@mongodb:27017
      TM_API_TOKEN: *tm_token
      # The push worker. Without TM_API_URL the mock never posts its plan.
      TM_API_URL: http://tm-api:8000/api/v1
      PLANNING_PUSH_INTERVAL_SECONDS: "5"
    depends_on:
      mongodb: {condition: service_healthy}

  tm-connector:
    mem_limit: 1000m
    build:
      context: ./tm-connector
      dockerfile: dockerfile
    ports: ["18500:80"]
    environment:
      Quix__Broker__Address: redpanda:9092
      metadata_input: mf4_metadata
      batch_input: mf4-to-msg
      TM_API_URL: http://tm-api:8000/api/v1
      TM_API_TOKEN: *tm_token
      TM_ACTOR: ingestion
      LAKE_TABLE: *lake_table
      TM_HTTP_TIMEOUT_SECONDS: "900"
      TM_RUN_KEY_PATTERN: *run_key_pattern
      TM_STALL_SECONDS: "900"
      TM_STATUS_PORT: "80"
      LOGLEVEL: INFO
    depends_on:
      redpanda: {condition: service_healthy}
      tm-api: {condition: service_started}

  tm-frontend:
    mem_limit: 500m
    build:
      context: ./frontend
      dockerfile: dockerfile
      args: {TM_BE_URL: http://tm-api:8000}
    profiles: ["ui"]
    ports: ["18300:3000"]
    environment:
      API_URL: http://localhost:3000
      TM_BE_URL: http://tm-api:8000
      TM_API_TOKEN: *tm_token
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      TM_LAKE_TABLE: *lake_table
      TM_LAKE_SESSION_PARTITIONS: *lake_session_partitions
      TM_LAKE_DATA_PARTITIONS: *lake_data_partitions
    depends_on:
      tm-api: {condition: service_started}

volumes:
  blob-data:
