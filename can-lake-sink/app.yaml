name: can-lake-sink
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Topic carrying decoded CAN envelopes (published by mf4-replay)
    defaultValue: can-decoded
    required: true
  - name: CONSUMER_GROUP
    inputType: FreeText
    description: Kafka consumer group. Change it to re-sink already-consumed messages.
    defaultValue: can-lake-sink
    required: true
  - name: SIGNALS_TABLE
    inputType: FreeText
    description: Lakehouse table for decoded signal samples, at the grain
      channel -> sender_node -> frame -> signal
    defaultValue: can_signals
    required: true
  - name: UNKNOWN_TABLE
    inputType: FreeText
    description: Table for frames with no DBC entry, raw payload preserved. Leave
      empty to drop them instead (about a third of frames in this dataset).
    defaultValue: can_unknown_frames
    required: false
  - name: S3_PREFIX
    inputType: FreeText
    description: Blob path prefix the sink writes Hive-partitioned parquet under
    defaultValue: can-lake
    required: true
  - name: NAMESPACE
    inputType: FreeText
    description: REST Catalog namespace the tables are registered in
    defaultValue: default
    required: false
  - name: HIVE_COLUMNS
    inputType: FreeText
    description: Partition columns for can_signals. year/month/day are derived by
      the sink from the timestamp column. Keep low-cardinality - do NOT add signal
      (2150 values) or frame_name (331); Iceberg column stats prune those anyway.
    defaultValue: platform,channel,sender_node,year,month,day
    required: true
  - name: UNKNOWN_HIVE_COLUMNS
    inputType: FreeText
    description: Partition columns for can_unknown_frames (no sender_node - those
      frames have no DBC entry, so no sender is known)
    defaultValue: platform,channel,year,month,day
    required: true
  - name: COMMIT_INTERVAL
    inputType: FreeText
    description: Seconds before a batch is flushed
    defaultValue: "30"
    required: false
  - name: COMMIT_EVERY
    inputType: FreeText
    description: Messages before a batch is flushed. Each envelope expands to
      roughly 200 signal rows, so 200 messages is about 40k rows.
    defaultValue: "200"
    required: false
  - name: LOGLEVEL
    inputType: FreeText
    defaultValue: INFO
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py