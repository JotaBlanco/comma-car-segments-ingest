name: mongo-backup-manager
language: python
variables:
  - name: MONGO_URI
    inputType: FreeText
    description: MongoDB connection URI for the testmanager database
    defaultValue: "mongodb://admin:mongo_password@mongodb:27017/testmanager?authSource=admin"
    required: true
  - name: BACKUP_INTERVAL_HOURS
    inputType: FreeText
    description: Number of hours between backup cycles
    defaultValue: "24"
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
