name: mongo-backup-manager
language: python
variables:
  - name: MONGO_HOST
    inputType: FreeText
    description: MongoDB host:port
    defaultValue: "mongodb:27017"
    required: true
  - name: MONGO_USER
    inputType: FreeText
    description: MongoDB root username
    defaultValue: "admin"
    required: true
  - name: MONGO_PASSWORD
    inputType: ProjectVariable
    description: MongoDB root password (project secret)
    defaultValue: mongo_password
    secret: true
    required: true
  - name: MONGO_DB_NAME
    inputType: FreeText
    description: MongoDB database name
    defaultValue: "testmanager"
    required: true
  - name: BACKUP_INTERVAL_HOURS
    inputType: FreeText
    description: Number of hours between backup cycles
    defaultValue: "24"
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
