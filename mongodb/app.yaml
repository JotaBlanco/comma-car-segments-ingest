name: mongodb
language: docker
variables:
  - name: MONGO_INITDB_ROOT_USERNAME
    inputType: FreeText
    description: The root username to initialize MongoDB with
    defaultValue: admin
    required: true
  - name: MONGO_INITDB_ROOT_PASSWORD
    inputType: ProjectVariable
    description: The root password to initialize MongoDB with
    defaultValue: mongo_password
    required: true
    secret: true
  - name: MONGO_DBPATH
    inputType: FreeText
    description: >-
      Absolute path to the mongod data directory. Must be a directory inside the /app/state
      state volume; the entry point refuses to start on any other path, because container-local
      storage is discarded on restart. Bumping this to an unused directory (mongodb-v3, ...) is
      the supported way to force a clean database: mongod initialises from scratch and the old
      directory is left untouched on the volume. The entry point never deletes data, so
      reclaiming an abandoned directory's space is a separate manual step.
    defaultValue: /app/state/mongodb-v2
    required: true
dockerfile: dockerfile
defaultFile: dockerfile
libraryItemId: mongodb
