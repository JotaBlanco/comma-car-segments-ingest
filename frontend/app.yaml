name: frontend
language: nodejs
variables:
  - name: API_URL
    inputType: FreeText
    description: Backend API URL for server-side requests (internal Kubernetes service name)
    defaultValue: http://test-manager-backend
    required: true
  - name: NODE_ENV
    inputType: FreeText
    description: Node environment
    defaultValue: production
    required: true
  - name: NEXT_TELEMETRY_DISABLED
    inputType: FreeText
    description: Disable Next.js telemetry
    defaultValue: 1
  - name: MF4_UPLOAD_URL
    inputType: FreeText
    description: MF4 upload service base URL, used by the Add Test Run dialog. Unset disables MF4 upload.
    defaultValue: https://mf4import-testrigorg-commacarsegmentsingest-t-b5554eca.testrig-depl.dev.quix.io
    required: false
  - name: MEASUREMENTS_URL
    inputType: FreeText
    multiline: false
    defaultValue: https://query-ui-quixers-testrigdemodatawarehouse-prod.az-france-0.app.quix.io/
    required: true
dockerfile: dockerfile
runEntryPoint: package.json
defaultFile: package.json
