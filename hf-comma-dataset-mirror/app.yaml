name: HF CommaCarSegments Mirror
language: python
variables:
  - name: HF_DATASET_REPO_ID
    inputType: FreeText
    description: Hugging Face dataset repo ID to mirror (e.g. commaai/commaCarSegments)
    defaultValue: commaai/commaCarSegments
    required: true
  - name: HF_REPO_TYPE
    inputType: FreeText
    description: Hugging Face repo type (dataset, model, or space)
    defaultValue: dataset
    required: true
  - name: BLOB_DEST_PREFIX
    inputType: FreeText
    description: Destination prefix (folder) in blob storage to mirror the dataset into
    defaultValue: commacarsegments/
    required: true
  - name: SKIP_EXISTING
    inputType: FreeText
    description: If "true", skip files that already exist at the destination
    defaultValue: "true"
    required: true
  - name: HF_TOKEN
    inputType: ProjectVariable
    description: Optional Hugging Face access token, only needed if the dataset requires authentication
    defaultValue: HF_TOKEN
    secret: true
    required: false
dockerfile: Dockerfile
runEntryPoint: main.py
defaultFile: main.py
