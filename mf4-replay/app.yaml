name: mf4-replay
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Topic announcing converted MF4 files (published by rlog-to-mf4)
    defaultValue: mf4-metadata
    required: true
  - name: output
    inputType: OutputTopic
    description: Topic receiving one message per decoded CAN envelope
    defaultValue: can-decoded
    required: true
  - name: CONSUMER_GROUP
    inputType: FreeText
    description: Kafka consumer group. Change it to replay the same files again.
    defaultValue: mf4-replay
    required: true
  - name: MAX_FILES
    inputType: FreeText
    description: Stop after replaying this many MF4 files. 1 keeps the debug output
      small; 0 means no limit.
    defaultValue: "1"
    required: true
  - name: MAX_ENVELOPES_PER_FILE
    inputType: FreeText
    description: Envelopes to publish per file. Envelopes arrive at ~100 Hz, so 500 is
      about 5 seconds of driving. A whole 60s segment is ~6000. 0 means all.
    defaultValue: "500"
    required: true
  - name: DCM_BASE_URL
    inputType: FreeText
    description: Dynamic Configuration Manager API. In-cluster service address of the
      managed DCM deployment.
    defaultValue: http://config-api-svc/api/v1
    required: true
  - name: DCM_TYPE
    inputType: FreeText
    description: Fallback config type, used only if an MF4 header carries no DCM key
    defaultValue: dbc
    required: false
  - name: DCM_TARGET_KEY
    inputType: FreeText
    description: Fallback target_key, used only if an MF4 header carries no DCM key
    defaultValue: FORD_F_150_LIGHTNING_MK1
    required: false
  - name: LOGLEVEL
    inputType: FreeText
    defaultValue: INFO
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
