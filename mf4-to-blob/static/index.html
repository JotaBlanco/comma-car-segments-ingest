<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MF4 to Blob</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #e1e4e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            background: #1c1f26;
            border-radius: 12px;
            padding: 40px;
            width: 640px;
            max-width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .subtitle {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .drop-zone {
            border: 2px dashed #30363d;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 16px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #58a6ff;
            background: rgba(88,166,255,0.05);
        }
        .drop-zone p { color: #8b949e; }
        input[type="file"] { display: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { background: #2ea043; }
        button:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }
        .summary {
            color: #8b949e;
            font-size: 0.85rem;
            margin: 12px 0 8px;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .file-row {
            background: #161922;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 12px 14px;
        }
        .file-row .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .file-row .name {
            color: #e1e4e8;
            font-weight: 500;
            font-size: 0.92rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-row .status {
            color: #8b949e;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .file-row .remove {
            background: none;
            border: none;
            color: #6e7681;
            font-size: 1rem;
            padding: 0 4px;
            width: auto;
            cursor: pointer;
        }
        .file-row .remove:hover { color: #f85149; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #58a6ff;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s, background 0.2s;
        }
        .file-row.done .progress-fill { background: #238636; }
        .file-row.error .progress-fill { background: #f85149; }
        .file-row.done .status { color: #3fb950; }
        .file-row.error .status { color: #f85149; }
        .err-msg {
            color: #f85149;
            font-size: 0.8rem;
            margin-top: 6px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MF4 to Blob</h1>
        <p class="subtitle">Drag and drop one or more <code>.mf4</code> files. Each is uploaded to the workspace blob storage and a metadata message is published.</p>

        <div class="drop-zone" id="dropZone">
            <p>Drag and drop .mf4 files here, or click to browse</p>
        </div>
        <input type="file" id="fileInput" accept=".mf4" multiple>

        <div class="summary" id="summary"></div>
        <div class="file-list" id="fileList"></div>

        <button id="sendBtn" disabled>Upload selected files</button>
    </div>

    <!--
      @azure/storage-blob 12.31.0, pinned, served as ESM via jsDelivr's
      `+esm` transform (the package ships no UMD bundle any more). Imported
      *dynamically*, and only when /config reports upload_mode "sas": on an
      S3/S3Compatible workspace the SAS path is never taken, so the CDN is
      never contacted and a blocked CDN cannot break the page.
    -->
    <script type="module">
    const AZURE_SDK_URL = "https://cdn.jsdelivr.net/npm/@azure/storage-blob@12.31.0/+esm";

    (function () {
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileList = document.getElementById('fileList');
        const summary = document.getElementById('summary');

        let files = [];
        let concurrency = 3;
        let inFlight = 0;
        let queue = [];
        let uploading = false;
        // "direct" (server-side streaming upload) works on every blob backend;
        // "sas" is Azure-only. The server decides from the injected connection
        // JSON - we just obey /config, and default to direct if the call fails
        // because that is the path with no provider requirement.
        let uploadMode = 'direct';

        const configReady = fetch('/config')
            .then(r => (r.ok ? r.json() : null))
            .then(cfg => {
                if (!cfg) return;
                if (cfg.concurrency_hint) concurrency = cfg.concurrency_hint;
                if (cfg.upload_mode === 'sas' || cfg.upload_mode === 'direct') {
                    uploadMode = cfg.upload_mode;
                }
            })
            .catch(() => {});

        function fmtBytes(n) {
            if (n == null) return '';
            const u = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
            return n.toFixed(n < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
        }

        function uid() {
            return (crypto.randomUUID && crypto.randomUUID()) ||
                ('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0;
                    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
                }));
        }

        function addFiles(picked) {
            const valid = Array.from(picked).filter(f => f.name.toLowerCase().endsWith('.mf4'));
            const skipped = picked.length - valid.length;
            for (const f of valid) {
                files.push({
                    id: uid(),
                    file: f,
                    status: 'pending',
                    bytesSent: 0,
                    percent: 0,
                    error: null,
                    uploadId: null,
                    blobPath: null,
                });
            }
            render();
            if (skipped > 0) {
                summary.textContent = `Skipped ${skipped} non-.mf4 file(s).`;
            }
        }

        function removeEntry(id) {
            const e = files.find(x => x.id === id);
            if (!e) return;
            if (e.status === 'uploading' || e.status === 'queued' || e.status === 'finalizing') return;
            files = files.filter(x => x.id !== id);
            render();
        }

        function render() {
            fileList.innerHTML = '';
            for (const e of files) {
                const row = document.createElement('div');
                row.className = 'file-row ' + (e.status === 'done' ? 'done' : e.status === 'error' ? 'error' : '');
                row.dataset.id = e.id;

                const meta = document.createElement('div');
                meta.className = 'meta';

                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = e.file.name;
                meta.appendChild(name);

                const status = document.createElement('div');
                status.className = 'status';
                status.textContent = statusLabel(e);
                meta.appendChild(status);

                if (!uploading || e.status === 'pending') {
                    const remove = document.createElement('button');
                    remove.className = 'remove';
                    remove.title = 'Remove';
                    remove.textContent = 'x';
                    remove.onclick = () => removeEntry(e.id);
                    meta.appendChild(remove);
                }

                row.appendChild(meta);

                const bar = document.createElement('div');
                bar.className = 'progress-bar';
                const fill = document.createElement('div');
                fill.className = 'progress-fill';
                fill.style.width = (e.status === 'done' ? 100 : e.percent) + '%';
                bar.appendChild(fill);
                row.appendChild(bar);

                if (e.status === 'error' && e.error) {
                    const err = document.createElement('div');
                    err.className = 'err-msg';
                    err.textContent = e.error;
                    row.appendChild(err);
                }

                fileList.appendChild(row);
            }

            const total = files.length;
            const done = files.filter(x => x.status === 'done').length;
            const errored = files.filter(x => x.status === 'error').length;
            if (total === 0) {
                summary.textContent = '';
            } else if (uploading || done + errored > 0) {
                summary.textContent = `${done} of ${total} complete` + (errored ? ` — ${errored} failed` : '');
            } else {
                summary.textContent = `${total} file(s) ready (${fmtBytes(files.reduce((a, x) => a + x.file.size, 0))})`;
            }

            sendBtn.disabled = uploading || files.filter(x => x.status === 'pending').length === 0;
            sendBtn.textContent = uploading ? 'Uploading...' : 'Upload selected files';
        }

        function statusLabel(e) {
            switch (e.status) {
                case 'pending': return fmtBytes(e.file.size);
                case 'queued': return 'queued';
                case 'uploading': return `${e.percent}% — ${fmtBytes(e.bytesSent)} / ${fmtBytes(e.file.size)}`;
                case 'finalizing': return 'finalizing...';
                case 'done': return `done — ${fmtBytes(e.file.size)}`;
                case 'error': return 'failed';
                default: return '';
            }
        }

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) addFiles(fileInput.files);
            fileInput.value = '';
        });

        sendBtn.addEventListener('click', () => {
            if (uploading) return;
            uploading = true;
            queue = files.filter(e => e.status === 'pending').slice();
            for (const e of queue) e.status = 'queued';
            render();
            pump();
        });

        function pump() {
            while (inFlight < concurrency && queue.length > 0) {
                const e = queue.shift();
                inFlight++;
                startUpload(e).finally(() => {
                    inFlight--;
                    if (queue.length === 0 && inFlight === 0) {
                        uploading = false;
                    }
                    render();
                    pump();
                });
            }
        }

        async function startUpload(e) {
            e.status = 'uploading';
            e.percent = 0;
            e.bytesSent = 0;
            render();

            await configReady;
            // The one branch that decides everything: Azure workspaces upload
            // browser -> Azure via SAS; every other backend streams through the
            // app with POST /upload/direct.
            if (uploadMode === 'sas') {
                return startSasUpload(e);
            }
            return startDirectUpload(e);
        }

        function startDirectUpload(e) {
            // XHR, not fetch: fetch has no upload-progress event and the
            // progress bar is the point of this page. The body is the File
            // itself - no multipart envelope - so the server can pipe it
            // straight into blob storage.
            return new Promise(resolve => {
                const xhr = new XMLHttpRequest();
                const url = '/upload/direct?filename=' + encodeURIComponent(e.file.name) +
                    '&size=' + e.file.size;
                xhr.open('POST', url, true);
                xhr.setRequestHeader('Content-Type', 'application/octet-stream');

                xhr.upload.onprogress = ev => {
                    e.bytesSent = ev.loaded;
                    e.percent = e.file.size
                        ? Math.min(99, Math.round(ev.loaded / e.file.size * 100))
                        : 0;
                    render();
                };
                xhr.upload.onload = () => {
                    // Bytes are away; the server is still flushing the last
                    // block and producing the metadata message.
                    e.status = 'finalizing';
                    render();
                };
                xhr.onload = () => {
                    let body = null;
                    try { body = JSON.parse(xhr.responseText); } catch (parseErr) { body = null; }
                    if (xhr.status >= 200 && xhr.status < 300 && body && body.status === 'done') {
                        e.uploadId = body.upload_id;
                        e.blobPath = body.blob_path;
                        e.status = 'done';
                        e.percent = 100;
                        e.bytesSent = e.file.size;
                    } else {
                        e.status = 'error';
                        e.error = `direct: HTTP ${xhr.status}` +
                            (body && body.message ? ` ${body.message}` : '');
                    }
                    resolve();
                };
                xhr.onerror = () => {
                    e.status = 'error';
                    e.error = 'direct: network error';
                    resolve();
                };
                xhr.onabort = () => {
                    e.status = 'error';
                    e.error = 'direct: aborted';
                    resolve();
                };
                xhr.send(e.file);
            });
        }

        async function startSasUpload(e) {
            // Step 1: ask server for a SAS URL.
            let sasResp;
            try {
                const r = await fetch('/upload/sas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: e.file.name, size: e.file.size }),
                });
                const body = await r.json().catch(() => null);
                if (!r.ok) {
                    e.status = 'error';
                    e.error = `sas: HTTP ${r.status}` + (body && body.message ? ` ${body.message}` : '');
                    return;
                }
                sasResp = body;
            } catch (err) {
                e.status = 'error';
                e.error = `sas: ${err.message || err}`;
                return;
            }

            e.uploadId = sasResp.uploadId;
            e.blobPath = sasResp.blobPath;

            // Step 2: PUT directly to Azure via @azure/storage-blob.
            try {
                const { BlockBlobClient } = await import(AZURE_SDK_URL);
                const client = new BlockBlobClient(sasResp.sasUrl);
                await client.uploadData(e.file, {
                    blockSize: 4 * 1024 * 1024,
                    concurrency: 4,
                    onProgress: ev => {
                        e.bytesSent = ev.loadedBytes;
                        e.percent = e.file.size
                            ? Math.min(99, Math.round(ev.loadedBytes / e.file.size * 100))
                            : 0;
                        render();
                    },
                });
            } catch (err) {
                e.status = 'error';
                e.error = `azure: ${err.message || err}`;
                return;
            }

            // Step 3: tell the server we're done so it can produce metadata.
            e.status = 'finalizing';
            render();
            try {
                const r = await fetch('/upload/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        uploadId: e.uploadId,
                        blobPath: e.blobPath,
                        size: e.file.size,
                    }),
                });
                const body = await r.json().catch(() => null);
                if (!(r.ok && body && body.status === 'done')) {
                    e.status = 'error';
                    e.error = `complete: HTTP ${r.status}` + (body && body.message ? ` ${body.message}` : '');
                    return;
                }
                e.status = 'done';
                e.percent = 100;
                e.bytesSent = e.file.size;
            } catch (err) {
                e.status = 'error';
                e.error = `complete: ${err.message || err}`;
            }
        }
    })();
    </script>
</body>
</html>
