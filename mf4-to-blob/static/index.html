<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MF4 to Blob</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #e1e4e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            background: #1c1f26;
            border-radius: 12px;
            padding: 40px;
            width: 640px;
            max-width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .subtitle {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .drop-zone {
            border: 2px dashed #30363d;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 16px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #58a6ff;
            background: rgba(88,166,255,0.05);
        }
        .drop-zone p { color: #8b949e; }
        input[type="file"] { display: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { background: #2ea043; }
        button:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }
        .summary {
            color: #8b949e;
            font-size: 0.85rem;
            margin: 12px 0 8px;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .file-row {
            background: #161922;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 12px 14px;
        }
        .file-row .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .file-row .name {
            color: #e1e4e8;
            font-weight: 500;
            font-size: 0.92rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-row .status {
            color: #8b949e;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .file-row .remove {
            background: none;
            border: none;
            color: #6e7681;
            font-size: 1rem;
            padding: 0 4px;
            width: auto;
            cursor: pointer;
        }
        .file-row .remove:hover { color: #f85149; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #58a6ff;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s, background 0.2s;
        }
        .file-row.done .progress-fill { background: #238636; }
        .file-row.error .progress-fill { background: #f85149; }
        .file-row.done .status { color: #3fb950; }
        .file-row.error .status { color: #f85149; }
        .err-msg {
            color: #f85149;
            font-size: 0.8rem;
            margin-top: 6px;
            word-break: break-word;
        }
        .err-msg:empty { display: none; }

        /* The claim lives on the row, one editor per file: one card cannot
           state four run ids. Unstyled beyond legibility - the chips, the
           revert control and the summary line are FrontEndEsthetic's. */
        .claim-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 0.78rem;
            color: #8b949e;
            margin-bottom: 8px;
            word-break: break-word;
        }
        .claim-toggle, .claim-bulk {
            width: auto;
            padding: 0;
            background: none;
            border: none;
            color: #58a6ff;
            font-size: 0.78rem;
            font-weight: 500;
            flex-shrink: 0;
            cursor: pointer;
        }
        .claim-toggle:hover:not(:disabled), .claim-bulk:hover:not(:disabled) {
            background: none;
            text-decoration: underline;
        }
        .claim {
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 10px 12px 12px;
            margin: 0 0 10px;
        }
        .claim legend {
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0 6px;
        }
        .claim-hint { font-weight: 400; color: #8b949e; }
        .claim-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 10px 14px;
        }
        .claim-grid label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8rem;
            color: #8b949e;
        }
        .claim-grid input {
            padding: 6px 8px;
            background: #0f1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e1e4e8;
            font: inherit;
            font-size: 0.85rem;
        }
        .claim-grid input:focus {
            outline: 2px solid #58a6ff;
            outline-offset: -1px;
            border-color: #58a6ff;
        }
        .chip { font-size: 0.7rem; color: #6e7681; }
        .chip.typed { color: #58a6ff; }
        .revert {
            width: auto;
            padding: 0 4px;
            background: none;
            border: none;
            color: #8b949e;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .revert:hover:not(:disabled) { background: none; color: #58a6ff; }
        .claim-bulk { margin-top: 10px; display: block; }
        .claim-note {
            margin: 8px 0 0;
            font-size: 0.75rem;
            color: #6e7681;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MF4 to Blob</h1>
        <p class="subtitle">Drag and drop one or more <code>.mf4</code> files. Each is uploaded to the workspace blob storage and a metadata message is published.</p>

        <div class="drop-zone" id="dropZone">
            <p>Drag and drop .mf4 files here, or click to browse</p>
        </div>
        <input type="file" id="fileInput" accept=".mf4" multiple>

        <div class="summary" id="summary"></div>

        <!--
          One claim editor per file, filled from that recording's own `test.*`
          header properties before a byte is uploaded. A field the operator
          TYPES rides as a `declared.*` query parameter into the message's
          `declared` bag - the registry's own vocabulary, read verbatim by
          tm-connector - and beats both the filename and the file's own header.
          A field nobody touched states nothing, so the recording answers it.

          Everything here is OPTIONAL: an upload that claims nothing still
          registers, and its run is resolved from the file at decode time.

          Test definitions are NOT typed here: the recording states its own set
          in `test.definitions`, and the Test Run page corrects it.
        -->
        <div class="file-list" id="fileList"></div>

        <button id="sendBtn" disabled>Upload selected files</button>
    </div>

    <script type="module" src="/static/upload-page.js"></script>
</body>
</html>
