name: quixlab
language: docker
variables:
  - name: QUIXLAB_NOTEBOOK
    inputType: FreeText
    description: Notebook file to open on startup (leave empty for the file picker).
    defaultValue: main.py
  - name: QUIXLAB_MODE
    inputType: Options
    description: "Run mode: 'edit' opens the full editor (canvas, cell editing, file picker); 'app' renders the notebook in read-only output-only mode for end-user consumption."
    defaultValue: edit
    options:
      - label: Edit (full editor)
        value: edit
      - label: App (view only)
        value: app
  - name: QUIXLAB_LOG_LEVEL
    inputType: Options
    description: Logging verbosity for the QuixLab process. DEBUG emits per-token-source and per-HTTP-call detail useful for diagnosing 403s and auth-chain issues.
    defaultValue: INFO
    options:
      - label: DEBUG
        value: DEBUG
      - label: INFO
        value: INFO
      - label: WARNING
        value: WARNING
      - label: ERROR
        value: ERROR
  - name: QUIX_PAT_TOKEN
    inputType: Secret
    description: A personal access token the verdict job queries the lake with, so an implementation reads data the workspace service identity cannot. Empty leaves the service identity.
    defaultValue: QUIX_PAT_TOKEN
    required: false
dockerfile: dockerfile
defaultFile: dockerfile
libraryItemId: quixlab
blobStorage:
  bind: true
