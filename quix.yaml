# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: HF CommaCarSegments Mirror
    application: hf-comma-dataset-mirror
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 1000
    blobStorage:
      bind: true
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 1200
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
    variables:
      - name: MONGO_DBPATH
        description: WiredTiger data directory (local disk = ephemeral; see mongodb/init.sh)
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 100
        memory: 500
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Configurations
        icon: tune
  - name: rlog to MF4
    application: rlog-to-mf4
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: INPUT_PREFIX
        description: The mirror keeps HuggingFace's layout, segments/<device>/<route>/<idx>/rlog.zst
      - name: DEVICES
        description: comma.ai device ids for this platform (manifest lookup, not a path level)
      - name: MAX_SEGMENTS
        description: Bulk backfill of a subset, not the whole dataset
    blobStorage:
      bind: true
  - name: MF4 replay
    application: mf4-replay
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: CONSUMER_GROUP
        value: mf4-replay-v4
    blobStorage:
      bind: true
  - name: CAN lake sink
    application: can-lake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    blobStorage:
      bind: true
    variables:
      - name: input
        inputType: InputTopic
        required: true
        value: can-decoded
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Change this to re-sink already-consumed messages
        required: true
        value: can-lake-sink-v3
      - name: SIGNALS_TABLE
        inputType: FreeText
        description: grain is channel -> sender_node -> frame -> signal
        required: true
        value: can_signals
      - name: UNKNOWN_TABLE
        inputType: FreeText
        description: frames with no DBC entry, raw payload kept
        required: false
        value: can_unknown_frames
      - name: S3_PREFIX
        inputType: FreeText
        required: true
        value: can-lake
      - name: HIVE_COLUMNS
        inputType: FreeText
        description: year/month/day are derived by the sink from the timestamp column
        required: true
        value: platform,channel,sender_node,year,month,day
      - name: UNKNOWN_HIVE_COLUMNS
        inputType: FreeText
        description: no sender_node - these frames have no DBC entry
        required: true
        value: platform,channel,year,month,day
      - name: COMMIT_EVERY
        inputType: FreeText
        required: false
        value: "200"

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
  - name: mf4-metadata
    dataTier: Bronze
  - name: can-raw
    dataTier: Bronze
  - name: can-decoded
    dataTier: Silver
