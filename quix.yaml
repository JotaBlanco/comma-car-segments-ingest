# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MF4 Import
    application: mf4-to-blob
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    publicAccess:
      enabled: true
      urlPrefix: mf4import
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: MF4 Import
        icon: upload_file
        order: 0
    blobStorage:
      bind: true
  - name: MF4 Decoder
    application: mf4-decoder
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2500
    desiredStatus: Running
    variables:
      - name: BATCH_RECORDS
        value: 5000
      - name: DBC_SOURCE
        description: embedded = decode CAN bus-logging files with the DBC attached inside the MF4; none = do not decode.
    blobStorage:
      bind: true
  - name: MF4 DataLake Sink
    application: mf4-datalake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: TABLE_NAME
        value: mdf_file_test_v1
      - name: CONSUMER_GROUP
        value: mdf_file_test_lake_v1.1
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: mf4_metadata
  - name: mf4-to-msg
