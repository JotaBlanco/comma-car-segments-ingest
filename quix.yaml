# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: HF CommaCarSegments Mirror
    application: hf-comma-dataset-mirror
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 1000
    blobStorage:
      bind: true
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 1200
    state:
      enabled: true
      size: 5
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
  - name: MongoDB Backup Manager
    group: Aux services
    application: mongodb-backup-manager
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb-backup-manager
      ports:
        - port: 80
          targetPort: 80
    variables:
      - name: SECRET_KEY
        inputType: FreeText
    blobStorage:
      bind: true
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 100
        memory: 500
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Configurations
        icon: tune
  - name: MF4 replay
    application: mf4-replay
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: CONSUMER_GROUP
        inputType: FreeText
        value: mf4-replay-v7
      - name: MAX_FILES
        inputType: FreeText
        value: 0
      - name: MAX_ENVELOPES_PER_FILE
        inputType: FreeText
        value: 0
    blobStorage:
      bind: true
  - name: Blob explorer
    application: blob-explorer
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 500
    variables:
      - name: PREFIXES
        inputType: FreeText
        description: blob prefixes to inspect; the leading empty entry is the root
      - name: DEVICES
        inputType: FreeText
        description: count rlog.zst per device, to see how far the mirror got
    blobStorage:
      bind: true
  - name: CAN lake sink 2
    application: can-lake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: CONSUMER_GROUP
        inputType: FreeText
        value: can-lake-sink-v7
      - name: SIGNALS_TABLE
        inputType: FreeText
        value: can_signals_v4
      - name: SINK_UNKNOWN_FRAMES
        inputType: FreeText
        value: false
      - name: UNKNOWN_TABLE
        inputType: FreeText
        value: can_unknown_frames_v3
      - name: HIVE_COLUMNS
        inputType: FreeText
        value: platform,device,route,~channel,~sender_node,~frame_name,~signal,~channel_name
      - name: UNKNOWN_HIVE_COLUMNS
        inputType: FreeText
        value: platform,device,route,channel
      - name: COMMIT_EVERY
        inputType: FreeText
        value: 100000
    blobStorage:
      bind: true
  - name: Quix Lakehouse Sink
    application: quix-lakehouse-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 3000
      replicas: 8
    variables:
      - name: TABLE_NAME
        inputType: FreeText
        value: can_signals_v13
      - name: HIVE_COLUMNS
        inputType: FreeText
        value: platform,device,route,~channel_name,~sender_node,~frame_name,~signal
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        value: t_abs_ms
      - name: SORT_COLUMN
        inputType: FreeText
        value: t_abs_ms
      - name: BATCH_SIZE
        inputType: FreeText
        value: 2000
      - name: CONSUMER_GROUP
        inputType: FreeText
        value: s3_direct_sink_v2.0
      - name: MAX_WRITE_WORKERS
        inputType: FreeText
        value: 1
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
  - name: mf4-metadata
    dataTier: Bronze
  - name: can-raw
    dataTier: Bronze
  - name: can-decoded
    configuration:
      partitions: 8
      retentionInBytes: 5368709120
    dataTier: Silver
