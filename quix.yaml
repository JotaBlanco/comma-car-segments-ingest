# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 1200
    state:
      enabled: true
      size: 5
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
  - name: MongoDB Backup Manager
    group: Aux services
    application: mongodb-backup-manager
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb-backup-manager
      ports:
        - port: 80
          targetPort: 80
    variables:
      - name: SECRET_KEY
        inputType: FreeText
    blobStorage:
      bind: true
  - name: Quix Lakehouse Sink
    application: quix-lakehouse-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 3000
      replicas: 8
    variables:
      - name: TABLE_NAME
        inputType: FreeText
        value: can_signals_v13
      - name: HIVE_COLUMNS
        inputType: FreeText
        value: platform,device,route,~channel_name,~sender_node,~frame_name,~signal
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        value: t_abs_ms
      - name: SORT_COLUMN
        inputType: FreeText
        value: t_abs_ms
      - name: BATCH_SIZE
        inputType: FreeText
        value: 2000
      - name: CONSUMER_GROUP
        inputType: FreeText
        value: s3_direct_sink_v2.0
      - name: MAX_WRITE_WORKERS
        inputType: FreeText
        value: 1
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
  - name: mf4-metadata
    dataTier: Bronze
  - name: can-raw
    dataTier: Bronze
  - name: can-decoded
    configuration:
      partitions: 8
      retentionInBytes: 5368709120
    dataTier: Silver
