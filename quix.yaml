# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: HF CommaCarSegments Mirror
    application: hf-comma-dataset-mirror
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 1000
    blobStorage:
      bind: true
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 1200
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
    variables:
      - name: MONGO_DBPATH
        description: WiredTiger data directory (local disk = ephemeral; see mongodb/init.sh)
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 100
        memory: 500
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Configurations
        icon: tune
  - name: rlog to MF4
    application: rlog-to-mf4
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: INPUT_PREFIX
        description: The mirror keeps HuggingFace's layout, segments/<device>/<route>/<idx>/rlog.zst
      - name: DEVICES
        description: comma.ai device ids for this platform (manifest lookup, not a path level)
      - name: MAX_SEGMENTS
        description: Bulk backfill of a subset, not the whole dataset
    blobStorage:
      bind: true
  - name: MF4 replay
    application: mf4-replay
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    blobStorage:
      bind: true
    variables:
      - name: input
        inputType: InputTopic
        required: true
        value: mf4-metadata
      - name: output
        inputType: OutputTopic
        required: true
        value: can-decoded
      - name: config
        inputType: InputTopic
        description: DCM config events; QuixConfigurationService resolves the CAN
          database version per message from this
        required: true
        value: config-updates
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Change this to replay already-consumed files again
        required: true
        value: mf4-replay-v6
      - name: MAX_FILES
        inputType: FreeText
        description: 0 = every converted MF4 (20 today)
        required: true
        value: "0"
      - name: MAX_ENVELOPES_PER_FILE
        inputType: FreeText
        description: 0 = the whole 60s segment, ~6000 envelopes
        required: true
        value: "0"
      - name: DCM_TYPE
        inputType: FreeText
        required: false
        value: dbc
      - name: DCM_TARGET_KEY
        inputType: FreeText
        required: false
        value: FORD_F_150_LIGHTNING_MK1
  - name: CAN lake sink
    application: can-lake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: CONSUMER_GROUP
        description: Change this to re-sink already-consumed messages
        value: can-lake-sink-v7
      - name: SIGNALS_TABLE
        description: the v1 names, recreated after the originals were dropped. Partition columns are fixed once a table registers, so changing them needs a drop or a new name
      - name: UNKNOWN_TABLE
        description: frames with no DBC entry, raw payload kept
      - name: HIVE_COLUMNS
        description: drive identity, not the CAN hierarchy. sender_node/frame_name/ signal stay ordinary columns - Iceberg column stats prune them without partitioning, and partitioning on them cost 1830 files per 255k rows. No year/month/day either - those derive from the replay wall-clock.
        value: platform,device,route,channel
      - name: UNKNOWN_HIVE_COLUMNS
        description: same layout; these frames have no sender or signal
        value: platform,device,route,channel
      - name: COMMIT_EVERY
        description: envelopes per flush. Each expands to roughly 255 signal rows, so 2000 is about 500k rows per write.
        value: 2000
      - name: COMMIT_INTERVAL
        description: seconds before a partial batch is flushed
        value: 60
    blobStorage:
      bind: true
  - name: Blob explorer
    application: blob-explorer
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 500
    variables:
      - name: PREFIXES
        description: blob prefixes to inspect; the leading empty entry is the root
      - name: DEVICES
        description: count rlog.zst per device, to see how far the mirror got
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
  - name: mf4-metadata
    dataTier: Bronze
  - name: can-raw
    dataTier: Bronze
  - name: can-decoded
    configuration:
      retentionInBytes: 5368709120
    dataTier: Silver
