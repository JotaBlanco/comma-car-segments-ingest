# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 1200
    state:
      enabled: true
      size: 5
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 100
        memory: 500
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Configurations
        icon: tune
  - name: rlog to MF4
    application: rlog-to-mf4
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: INPUT_PREFIX
        description: The mirror keeps HuggingFace's layout, segments/<device>/<route>/<idx>/rlog.zst
      - name: DEVICES
        description: comma.ai device ids for this platform (manifest lookup, not a path level)
      - name: MAX_SEGMENTS
        description: 0 = every segment the mirror copied (206 of the platform's 230; the mirror job was OOM-killed before finishing)
        value: 0
    blobStorage:
      bind: true
  - name: MF4 replay
    application: mf4-replay
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: CONSUMER_GROUP
        value: mf4-replay-v7
      - name: MAX_FILES
        value: 0
      - name: MAX_ENVELOPES_PER_FILE
        value: 0
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
  - name: mf4-metadata
    dataTier: Bronze
  - name: can-raw
    dataTier: Bronze
  - name: can-decoded
    configuration:
      partitions: 8
      retentionInBytes: 5368709120
    dataTier: Silver
