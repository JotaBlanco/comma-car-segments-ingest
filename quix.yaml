# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: HF CommaCarSegments Mirror
    application: hf-comma-dataset-mirror
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 1000
    blobStorage:
      bind: true
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 1200
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
    variables:
      - name: MONGO_DBPATH
        description: WiredTiger data directory (local disk = ephemeral; see mongodb/init.sh)
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 100
        memory: 500
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Configurations
        icon: tune
  - name: rlog to MF4
    application: rlog-to-mf4
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: INPUT_PREFIX
        description: The mirror keeps HuggingFace's layout, segments/<device>/<route>/<idx>/rlog.zst
      - name: DEVICES
        description: comma.ai device ids for this platform (manifest lookup, not a path level)
      - name: MAX_SEGMENTS
        description: Bulk backfill of a subset, not the whole dataset
    blobStorage:
      bind: true
  # Consumes mf4-metadata, downloads each MF4 from blob, resolves its DBC from
  # DCM using the dcm.config_id in the file's own header, decodes, and publishes
  # one message per CAN envelope. No pacing - as fast as it can go.
  - name: MF4 replay
    application: mf4-replay
    version: latest
    deploymentType: Service
    resources:
      cpu: 1000
      memory: 2000
      replicas: 1
    blobStorage:
      bind: true
    variables:
      - name: input
        inputType: InputTopic
        required: true
        value: mf4-metadata
      - name: output
        inputType: OutputTopic
        required: true
        value: can-decoded
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Change this to replay already-consumed files again
        required: true
        value: mf4-replay-v1
      - name: MAX_FILES
        inputType: FreeText
        description: Debug-sized; 0 for no limit
        required: true
        value: "1"
      - name: MAX_ENVELOPES_PER_FILE
        inputType: FreeText
        description: ~100 envelopes per second, so 500 is about 5s of driving
        required: true
        value: "500"
      - name: DCM_BASE_URL
        inputType: FreeText
        required: true
        value: http://config-api-svc/api/v1
      - name: DCM_TYPE
        inputType: FreeText
        required: false
        value: dbc
      - name: DCM_TARGET_KEY
        inputType: FreeText
        required: false
        value: FORD_F_150_LIGHTNING_MK1

  # Grafana with the QuixLakeHouse datasource plugin baked in (sc-74412). Queries the
  # lakehouse over the Query API's POST /query; needs no topics, so it is not wired
  # into the pipeline graph.
  - name: Grafana
    group: Aux services
    application: quixlakehouse-grafana
    version: latest
    deploymentType: Service
    resources:
      cpu: 500
      memory: 1000
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: grafana
    network:
      serviceName: grafana
      ports:
        # Grafana listens on 3000. A mismatch here produces silent timeouts rather
        # than an error.
        - port: 80
          targetPort: 3000
    # Sibling of `variables`, not a member of it -- nested inside, it is silently
    # ignored and the Quix__Lakehouse__* bundle never injects. Grafana itself never
    # touches blob storage; the bind is purely the injection vehicle.
    blobStorage:
      bind: true
    variables:
      - name: GF_SECURITY_ADMIN_PASSWORD
        inputType: Secret
        description: Grafana admin password
        required: true
        secretKey: grafana_admin_password
      - name: GF_SERVER_ROOT_URL
        inputType: FreeText
        description: From this environment's publicUrlTemplate with url-prefix=grafana
        required: true
        value: https://grafana-testrigorg-commacarsegmentsingest-grafana.testrig-depl.dev.quix.io
      - name: GF_LOG_LEVEL
        inputType: FreeText
        required: false
        value: info
      # Overrides the token injected by the blobStorage bind. The Query API is
      # cluster-scoped in testrigorg-global, so auth.py validates Organisation/Read,
      # which the injected token does not satisfy -- hence "Authentication rejected".
      # A PAT passes. Set the secret with:
      #   quix cloud secrets set quixlake_query_token <PAT>
      - name: Quix__Lakehouse__Query__AuthToken
        inputType: Secret
        description: Org-scoped token or PAT for the Lakehouse Query API
        required: false
        secretKey: quixlake_query_token
    # No `state:` deliberately. Grafana keeps dashboards/users/alert rules in SQLite
    # at /var/lib/grafana, and the image does not redirect GF_PATHS_* to /app/state --
    # its entrypoint runs as uid 472 and cannot chown that mount. Enabling state here
    # would therefore persist nothing. The datasource survives regardless, being
    # re-provisioned at every boot; UI-authored dashboards do not. Fix by provisioning
    # dashboards as code, not by toggling this.

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
  - name: mf4-metadata
    dataTier: Bronze
  - name: can-raw
    dataTier: Bronze
  - name: can-decoded
    dataTier: Silver
