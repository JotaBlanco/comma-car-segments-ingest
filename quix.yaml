# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: "2.0"

# This section describes the Deployments of the data pipeline
deployments:
  - name: MongoDB
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 800
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017

  - name: Dynamic Config Manager
    application: dynamic-config-manager
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 300
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: config-manager

  - name: Backend API
    application: backend-api
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 300
        memory: 500
      replicas: 1
    network:
      serviceName: backend-api
      ports:
        - port: 80
    publicAccess:
      enabled: true
      urlPrefix: api

  - name: Lakehouse Sink - Test Data
    application: Lakehouse.Sink
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 500
        memory: 1024
      replicas: 1
    configuration:
      topic: test-data-uploads
      timestampColumn: received_at
      consumerGroup: lakehouse-sink-test-data-uploads
      autoOffsetReset: earliest
      commitTimeInterval: 60
      logLevel: INFO

  - name: Mongo Backup Manager
    application: mongo-backup-manager
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 300
      replicas: 1

  - name: Frontend
    application: frontend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 400
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: app

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
    configuration:
      partitions: 1
      retentionInMinutes: 1440

  - name: test-data-uploads
    configuration:
      partitions: 2
      retentionInMinutes: 1440
