# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MF4 Import
    group: Ingestion
    application: mf4-to-blob
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    publicAccess:
      enabled: true
      urlPrefix: mf4import
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: MF4 Import
        icon: upload_file
        order: 0
    blobStorage:
      bind: true
  - name: MF4 Decoder
    group: Ingestion
    application: mf4-decoder
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2500
    desiredStatus: Running
    variables:
      - name: BATCH_RECORDS
        value: 5000
    blobStorage:
      bind: true
  - name: MF4 DataLake Sink
    application: mf4-datalake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: TABLE_NAME
        description: New table - a partition-spec change is rejected on an existing one. mf4_signals_v2 is left untouched.
        value: mf4_signals_v4
      - name: HIVE_COLUMNS
        description: platform/device/route are physical key=value dirs; ~ columns are virtual (catalog-indexed, no dirs). Mirrors can_signals_v13.
      - name: TIMESTAMP_COLUMN
        description: Column used to derive time partitions
      - name: SORT_COLUMN
        description: Recorded as properties.sort_column so compaction writes time-ordered, skippable files
      - name: BATCH_SIZE
        description: Input messages per checkpoint. Each fans out to ~1388 rows; 2000 OOM-killed the pod at this 2000MB limit. Do not raise.
      - name: CONSUMER_GROUP
        description: Must change with TABLE_NAME so AUTO_OFFSET_RESET=earliest replays mf4-to-msg into the new table.
        value: mf4_signals_v4_lake_v1
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
    blobStorage:
      bind: true
  - name: Test Manager - Backend
    group: Test Manager
    application: backend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: backend-api
    state:
      enabled: true
      size: 1
    network:
      serviceName: test-manager-backend
      ports:
        - port: 80
          targetPort: 8080
    variables:
      - name: QUIXLAB_URL
        inputType: FreeText
        description: QuixLab public URL framed by the Test Implementation page
        value: https://quixlab-testrigorg-commacarsegmentsingest-t-b5554eca.testrig-depl.dev.quix.io
      - name: MONGO_PASSWORD
        variableKey: mongo_password
      - name: CONFIG_API_URL
        value: http://config-api-svc
      - name: DATA_LAKE_V2_TOPIC_NAME
        value: mf4_signals_v4
    blobStorage:
      bind: true
  - name: Test Manager - Frontend
    group: Test Manager
    application: frontend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: frontend-7bdbce0
    network:
      serviceName: test-manager-frontend
      ports:
        - port: 80
          targetPort: 3000
    variables:
      - name: MEASUREMENTS_URL
        description: Query Builder UI URL, mirrored from the backend for parity
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
      sidebarItem:
        show: true
        label: Test Manager
        icon: data_thresholding
        order: 1
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1500
    state:
      enabled: true
      size: 5
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
    variables:
      - name: MONGO_INITDB_ROOT_USERNAME
        description: The root username to initialize MongoDB with; must match the MONGO_USER secret
      - name: MONGO_INITDB_ROOT_PASSWORD
        description: The root password to initialize MongoDB with; must match the MONGO_PASSWORD secret
      - name: MONGO_DBPATH
        description: WiredTiger data directory. Local disk (EPHEMERAL) because the Quix state mount on this cluster is network-backed and WiredTiger fails on it with EPERM. Only move this under /app/state if that mount becomes block storage.
  - name: MongoDB Backup Manager
    group: Aux services
    application: mongodb-backup-manager
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    publicAccess:
      enabled: true
      urlPrefix: backup-manager
    state:
      enabled: true
      size: 1
    network:
      serviceName: backup-manager
      ports:
        - port: 80
          targetPort: 80
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Backup Manager
        icon: save
        order: 0
    blobStorage:
      bind: true
  - name: QuixLab
    application: quixlab
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    publicAccess:
      enabled: true
      urlPrefix: quixlab
    state:
      enabled: true
      size: 1
    network:
      ports:
        - port: 80
          targetPort: 80
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: QuixLab
        icon: grid_view
        order: 1
      globalItem:
        show: true
        label: QuixLab
        icon: find_in_page
        order: 1
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: mf4_metadata
  - name: mf4-to-msg
  - name: config-updates
