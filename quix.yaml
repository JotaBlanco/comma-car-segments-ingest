# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Test Manager - API
    group: Test Manager
    application: api
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 1000
    publicAccess:
      enabled: true
      urlPrefix: backend-api
    state:
      enabled: true
      size: 1
    network:
      serviceName: test-manager-backend
      ports:
        - port: 80
          targetPort: 8000
    variables:
      - name: TM_API_TOKEN
        description: The static bearer every /api/v1 route needs. The API refuses to start without it, and tm-connector, the frontend and the seeds all present the SAME project value.
      - name: MONGO_USER
        description: With MONGO_PASSWORD, the two pieces TM_COMMAND builds MONGO_URL from. The registry shares the MongoDB deployment with the Dynamic Configuration Manager and keeps its own `test_manager` database, so the password is never spelled inside a URL.
      - name: TM_COMMAND
        description: What this container runs. `python -m api.start_registry` builds MONGO_URL from the pieces above and hands over to uvicorn; blank would run the API against MONGO_URL directly.
        value: python -m api.start_registry
      - name: PLANNING_API_URL
        description: The planning system the registry mirrors work orders from. The mock below stands in for it.
      - name: CONFIG_API_URL
        description: The deployed Configuration Manager. Every new or changed work order is pushed there as a WorkOrder configuration, which is where the lake sink reads the platform fallback from. Empty disables the push.
        value: ''
      - name: TM_LAKE_TABLE
        inputType: ProjectVariable
        description: The lake table the statistics and Explore queries read - the SAME project value the sink writes and tm-connector claims.
        variableKey: LAKE_TABLE
      - name: MF4_IMPORT_URL
        description: The MF4 Import upload route the ingestion sweep posts blob dropbox files to. Blank leaves the sweep off; the import page is still reachable on its own URL.
      - name: TM_QUIXLAB_URL
        description: QuixLab's public URL. Empty hides the frontend's "Open in QuixLab" buttons.
        value: ''
      - name: TM_FTS_URL
        description: The Flight Test Station's public URL. This estate deploys no station, so it stays EMPTY and the run screen's station panel and the Workbooks nav entry hide themselves. Setting it lights both up against whatever is deployed there.
        value: ''
      - name: BLOB_ROOT
        description: The root folder every artefact of one test run hangs from. A definition's test implementation .py lands in BLOB_ROOT/<run_id>/, beside the trace MF4 Import wrote there, so this deployment and MF4 Import must carry the SAME value.
    blobStorage:
      bind: true
  - name: Planning Sync Mock
    group: Test Manager
    application: api
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 300
    network:
      serviceName: mock-planning
      ports:
        - port: 8003
          targetPort: 8003
    variables:
      - name: TM_COMMAND
        description: The same image as the API, told to run the planning mock instead.
        required: true
        value: uvicorn mock_planning.main:app --host 0.0.0.0 --port 8003
      - name: TM_API_URL
        description: The registry the push worker posts the catalog and its links to. Unset means the mock never pushes.
        required: true
        value: http://test-manager-backend/api/v1
  - name: Test Manager - Frontend
    group: Test Manager
    application: frontend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: frontend-7bdbce0
    network:
      serviceName: test-manager-frontend
      ports:
        - port: 80
          targetPort: 3000
    variables:
      - name: API_URL
        value: http://localhost:3000
      - name: TM_BE_URL
        value: http://test-manager-backend
      - name: TM_LAKE_TABLE
        inputType: ProjectVariable
        description: The physical lake table the Explore workbench names - the SAME project value the sink, the connector and the API read.
        variableKey: LAKE_TABLE
      - name: TM_LAKE_SESSION_PARTITIONS
        description: The partition levels that ADDRESS a session, outermost first, the last one being the session. The head of the sink's HIVE_COLUMNS.
      - name: TM_LAKE_DATA_PARTITIONS
        description: The partition levels INSIDE one session, the last one being the signal. The tail of the sink's HIVE_COLUMNS, ~ markers and all.
      - name: TM_FTS_URL
        description: The Flight Test Station's site root. This estate deploys no station, so it stays EMPTY and the Workbooks nav entry hides itself.
        value: ''
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Test Manager
        icon: data_thresholding
        order: 1
      globalItem:
        show: true
        label: Test Manager
        icon: view_list
        order: 0
  - name: QuixLab
    application: quixlab
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    publicAccess:
      enabled: true
      urlPrefix: quixlab
    state:
      enabled: true
      size: 1
    network:
      ports:
        - port: 80
          targetPort: 80
    variables:
      - name: QUIX_PAT_TOKEN
        description: The lake token the cloned verdict jobs query with. A project secret holding a personal access token.
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: QuixLab
        icon: grid_view
        order: 1
      globalItem:
        show: true
        label: QuixLab
        icon: find_in_page
        order: 1
    blobStorage:
      bind: true
  - name: MongoDB
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 800
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
  - name: tm-run-tas-1002-bat-sys-tc-004-81f3d43f
    application: quixlab
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 2000
    variables:
      - name: QUIX_PAT_TOKEN
        description: The lake token the cloned verdict jobs query with. A project secret holding a personal access token.
      - name: QUIXLAB_MODE
        inputType: FreeText
        value: run
      - name: QUIXLAB_NOTEBOOK
        value: blob://testrigorg-commacarsegmentsingest-testing/jama_ui/definitions/BAT-SYS-TC-004/notebook.py
      - name: QUIXLAB_PARAMS
        inputType: FreeText
        value: '{"run_id": "TAS-1002", "td_id": "BAT-SYS-TC-004", "implementation_key": "testrigorg-commacarsegmentsingest-testing/jama_ui/unassigned/d30adeba-BAT-SYS-TC-004.py", "lake_table": "battery_data_v1", "entrypoint": "evaluate"}'
    plugin: {}
    blobStorage:
      bind: true
  - name: tm-run-tas-1002-bat-sys-tc-006-2647d4f6
    application: quixlab
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 2000
    variables:
      - name: QUIX_PAT_TOKEN
        description: The lake token the cloned verdict jobs query with. A project secret holding a personal access token.
      - name: QUIXLAB_MODE
        inputType: FreeText
        value: run
      - name: QUIXLAB_NOTEBOOK
        value: blob://testrigorg-commacarsegmentsingest-testing/jama_ui/definitions/BAT-SYS-TC-006/notebook.py
      - name: QUIXLAB_PARAMS
        inputType: FreeText
        value: '{"run_id": "TAS-1002", "td_id": "BAT-SYS-TC-006", "implementation_key": "testrigorg-commacarsegmentsingest-testing/jama_ui/unassigned/2d4944e1-BAT-SYS-TC-006.py", "lake_table": "battery_data_v1", "entrypoint": "evaluate"}'
    plugin: {}
    blobStorage:
      bind: true

