# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MongoDB
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 800
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
  - name: Dynamic Config Manager
    application: dynamic-config-manager
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 300
    publicAccess:
      enabled: true
      urlPrefix: config-manager
  - name: Backend API
    application: backend-api
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 300
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: api
    network:
      serviceName: backend-api
      ports:
        - port: 80
  - name: Lakehouse Sink - Test Data
    application: lakehouse-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    variables:
      - name: input
        value: test-data-uploads
      - name: TIMESTAMP_COLUMN
        value: received_at
    blobStorage:
      bind: true
  - name: Mongo Backup Manager
    application: mongo-backup-manager
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 300
  - name: Frontend
    application: frontend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 400
    publicAccess:
      enabled: true
      urlPrefix: app

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: test-data-uploads
    configuration:
      partitions: 2
      retentionInMinutes: 1440
