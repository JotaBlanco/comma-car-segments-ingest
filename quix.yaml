# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MF4 Import
    application: mf4-to-blob
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    publicAccess:
      enabled: true
      urlPrefix: mf4import
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: MF4 Import
        icon: upload_file
        order: 0
    blobStorage:
      bind: true
  - name: MF4 Decoder
    application: mf4-decoder
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2500
    desiredStatus: Running
    variables:
      - name: BATCH_RECORDS
        value: 5000
      - name: DBC_SOURCE
        description: embedded = decode CAN bus-logging files with the DBC attached inside the MF4; none = do not decode.
    blobStorage:
      bind: true
  - name: MF4 DataLake Sink
    application: mf4-datalake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: TABLE_NAME
        value: mdf_file_test_v1
      - name: CONSUMER_GROUP
        value: mdf_file_test_lake_v1.1
    blobStorage:
      bind: true
  - name: Test Manager - Backend
    group: Test Manager
    application: backend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: backend-api
    network:
      serviceName: test-manager-backend
      ports:
        - port: 80
          targetPort: 8080
    variables:
      - name: MONGO_USER
        inputType: Secret
        description: MongoDB username; must match MONGO_INITDB_ROOT_USERNAME on the MongoDB deployment
        required: true
        secretKey: MONGO_USER
      - name: MONGO_PASSWORD
        inputType: Secret
        description: MongoDB password; must match MONGO_INITDB_ROOT_PASSWORD on the MongoDB deployment
        required: true
        secretKey: mongo_password
      - name: MONGO_HOST
        inputType: FreeText
        description: Internal service name of the MongoDB deployment
        required: true
        value: mongodb
      - name: CONFIG_API_URL
        inputType: FreeText
        description: Dynamic Configuration Manager base URL (its network.serviceName). Required - the backend fails to start without it.
        required: true
        value: http://config-api-svc
      - name: MEASUREMENTS_URL
        inputType: FreeText
        description: Query Builder UI used for the Measurements link. Optional - the endpoint returns 501 when unset.
        required: false
        value: https://query-ui-quixers-testrigdemodatawarehouse-prod.az-france-0.app.quix.io/
      - name: DATA_LAKE_V2_TOPIC_NAME
        inputType: FreeText
        description: Lakehouse table queried for test measurements. Points at the table this environment's MF4 DataLake Sink writes. Optional - the endpoint returns 501 when unset.
        required: false
        value: mdf_file_test_v1
      - name: ANALYTICS_URL
        inputType: FreeText
        description: Marimo notebook UI used for the Analytics link. Optional - the endpoint returns 501 when unset.
        required: false
        value: https://marimo-analysis-quixers-advancedanalyticsnew-new.az-france-0.app.quix.io
    blobStorage:
      bind: true
  - name: Test Manager - Frontend
    group: Test Manager
    application: frontend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: frontend-7bdbce0
    network:
      serviceName: test-manager-frontend
      ports:
        - port: 80
          targetPort: 3000
    variables:
      - name: API_URL
        inputType: FreeText
        description: Backend API URL for server-side requests (internal Kubernetes service name)
        required: true
        value: http://test-manager-backend
      - name: NODE_ENV
        inputType: FreeText
        description: Node environment
        required: true
        value: production
      - name: NEXT_TELEMETRY_DISABLED
        inputType: FreeText
        description: Disable Next.js telemetry
        value: 1
      - name: MEASUREMENTS_URL
        inputType: FreeText
        description: Query Builder UI URL, mirrored from the backend for parity
        required: false
        value: https://query-ui-quixers-testrigdemodatawarehouse-prod.az-france-0.app.quix.io/
    plugin:
      sidebarItem:
        show: true
        label: Test Manager
        icon: data_thresholding
        order: 1
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1500
    state:
      enabled: true
      size: 5
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
    variables:
      - name: MONGO_INITDB_ROOT_USERNAME
        inputType: FreeText
        description: The root username to initialize MongoDB with; must match the MONGO_USER secret
        required: true
        value: admin
      - name: MONGO_INITDB_ROOT_PASSWORD
        inputType: Secret
        description: The root password to initialize MongoDB with; must match the MONGO_PASSWORD secret
        required: true
        secretKey: mongo_password
      - name: MONGO_DBPATH
        inputType: FreeText
        description: WiredTiger data directory. Local disk (EPHEMERAL) because the Quix state mount on this cluster is network-backed and WiredTiger fails on it with EPERM. Only move this under /app/state if that mount becomes block storage.
        required: false
        value: /data/db
  - name: Dynamic Configuration Manager
    group: Aux services
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 200
        memory: 500
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
# This section describes the Topics of the data pipeline
topics:
  - name: mf4_metadata
  - name: mf4-to-msg
  - name: config-updates
