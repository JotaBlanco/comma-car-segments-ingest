# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: HF CommaCarSegments Mirror
    application: hf-comma-dataset-mirror
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 1000
    blobStorage:
      bind: true
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 1200
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
    variables:
      - name: MONGO_DBPATH
        description: WiredTiger data directory (local disk = ephemeral; see mongodb/init.sh)
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 100
        memory: 500
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Configurations
        icon: tune
  - name: rlog to MF4
    application: rlog-to-mf4
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: INPUT_PREFIX
        description: The mirror keeps HuggingFace's layout, segments/<device>/<route>/<idx>/rlog.zst
      - name: DEVICES
        description: comma.ai device ids for this platform (manifest lookup, not a path level)
      - name: MAX_SEGMENTS
        description: Bulk backfill of a subset, not the whole dataset
    blobStorage:
      bind: true
  - name: MF4 replay
    application: mf4-replay
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: CONSUMER_GROUP
        description: Change this to replay already-consumed files again
        value: mf4-replay-v1
      - name: MAX_FILES
        description: Debug-sized; 0 for no limit
      - name: MAX_ENVELOPES_PER_FILE
        description: ~100 envelopes per second, so 500 is about 5s of driving
    blobStorage:
      bind: true
  - name: Grafana
    group: Aux services
    application: quixlakehouse-grafana
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    publicAccess:
      enabled: true
      urlPrefix: grafana
    network:
      serviceName: grafana
      ports:
        - port: 80
          targetPort: 3000
    variables:
      - name: GF_SECURITY_ADMIN_PASSWORD
        description: Grafana admin password
      - name: GF_SERVER_ROOT_URL
        description: From this environment's publicUrlTemplate with url-prefix=grafana
      - name: Quix__Lakehouse__Query__AuthToken
        description: Org-scoped token or PAT for the Lakehouse Query API
    blobStorage:
      bind: true
  - name: QuixLab
    application: quixlab
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 8000
    publicAccess:
      enabled: true
      urlPrefix: quixlab
    state:
      enabled: true
      size: 20
    network:
      ports:
        - port: 80
          targetPort: 80
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: QuixLab
        icon: grid_view
        order: 1
      globalItem:
        show: true
        label: QuixLab
        icon: find_in_page
        order: 1
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
  - name: mf4-metadata
    dataTier: Bronze
  - name: can-raw
    dataTier: Bronze
  - name: can-decoded
    dataTier: Silver
