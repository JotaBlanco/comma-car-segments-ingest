# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MF4 Import
    group: Ingestion
    application: mf4-to-blob
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    publicAccess:
      enabled: true
      urlPrefix: mf4import
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: MF4 Import
        icon: upload_file
        order: 0
    blobStorage:
      bind: true
  - name: MF4 Decoder
    group: Ingestion
    application: mf4-decoder
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2500
    desiredStatus: Running
    variables:
      - name: BATCH_RECORDS
        value: 5000
      - name: FORCE_REDECODE
        description: Escape hatch for the decode-once filter. "false" skips a file that was already decoded, so replaying mf4_metadata cannot stack another copy of it in the lake. "true" re-decodes everything, duplicates included. Force a single file instead with force_redecode=true on its mf4_metadata message.
    blobStorage:
      bind: true
  - name: MF4 DataLake Sink
    group: Ingestion
    application: mf4-datalake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: TABLE_NAME
        value: mf4_signals_v4
      - name: CONSUMER_GROUP
        value: mf4_signals_v4_lake_v1
      - name: BATCH_SIZE
        value: 50
    blobStorage:
      bind: true
  - name: Test Manager - Backend
    group: Test Manager
    application: backend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: backend-api
    state:
      enabled: true
      size: 1
    network:
      serviceName: test-manager-backend
      ports:
        - port: 80
          targetPort: 8080
    variables:
      - name: QUIXLAB_URL
        inputType: FreeText
        description: QuixLab public URL framed by the Test Implementation page
        value: https://quixlab-testrigorg-commacarsegmentsingest-t-b5554eca.testrig-depl.dev.quix.io
      - name: MONGO_PASSWORD
        variableKey: mongo_password
      - name: CONFIG_API_URL
        value: http://config-api-svc
      - name: DATA_LAKE_V2_TOPIC_NAME
        value: mf4_signals_v4
    blobStorage:
      bind: true
  - name: Test Manager - Frontend
    group: Test Manager
    application: frontend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: frontend-7bdbce0
    network:
      serviceName: test-manager-frontend
      ports:
        - port: 80
          targetPort: 3000
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Test Manager
        icon: data_thresholding
        order: 1
      globalItem:
        show: true
        label: Test Manager
        icon: view_list
        order: 0
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1500
    state:
      enabled: true
      size: 5
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
    variables:
      - name: MONGO_INITDB_ROOT_USERNAME
        description: The root username to initialize MongoDB with; must match the MONGO_USER secret
      - name: MONGO_INITDB_ROOT_PASSWORD
        description: The root password to initialize MongoDB with; must match the MONGO_PASSWORD secret
      - name: MONGO_DBPATH
        description: WiredTiger data directory. Local disk (EPHEMERAL) because the Quix state mount on this cluster is network-backed and WiredTiger fails on it with EPERM. Only move this under /app/state if that mount becomes block storage.
  - name: MongoDB Backup Manager
    group: Aux services
    application: mongodb-backup-manager
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    publicAccess:
      enabled: true
      urlPrefix: backup-manager
    state:
      enabled: true
      size: 1
    network:
      serviceName: backup-manager
      ports:
        - port: 80
          targetPort: 80
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Backup Manager
        icon: save
        order: 0
    blobStorage:
      bind: true
  - name: Dynamic Configuration Manager
    group: Ingestion
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 100
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: config-api-svc
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Configurations
        icon: tune
        order: 0
  - name: QuixLab
    application: quixlab
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    publicAccess:
      enabled: true
      urlPrefix: quixlab
    state:
      enabled: true
      size: 1
    network:
      ports:
        - port: 80
          targetPort: 80
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: QuixLab
        icon: grid_view
        order: 1
      globalItem:
        show: true
        label: QuixLab
        icon: find_in_page
        order: 1
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: mf4_metadata
  - name: mf4-to-msg
  - name: config-updates
