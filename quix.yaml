# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: HF CommaCarSegments Mirror
    application: hf-comma-dataset-mirror
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 1000
    blobStorage:
      bind: true
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 1200
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 100
        memory: 500
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Configurations
        icon: tune
  - name: rlog to MF4
    application: rlog-to-mf4
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: INPUT_PREFIX
        description: The mirror keeps HuggingFace's layout, segments/<device>/<route>/<idx>/rlog.zst
      - name: DEVICES
        description: comma.ai device ids for this platform (manifest lookup, not a path level)
      - name: MAX_SEGMENTS
        description: 0 = every segment the mirror copied (206 of the platform's 230; the mirror job was OOM-killed before finishing)
        value: 0
    blobStorage:
      bind: true
  - name: MF4 replay
    application: mf4-replay
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: config
        description: DCM config events; QuixConfigurationService resolves the CAN database version per message from this
      - name: CONSUMER_GROUP
        description: Change this to replay already-consumed files again
        value: mf4-replay-v6
      - name: MAX_FILES
        description: 0 = every converted MF4 (20 today)
        value: 0
      - name: MAX_ENVELOPES_PER_FILE
        description: 0 = the whole 60s segment, ~6000 envelopes
        value: 0
    blobStorage:
      bind: true
  - name: Blob explorer
    application: blob-explorer
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 500
    variables:
      - name: PREFIXES
        description: blob prefixes to inspect; the leading empty entry is the root
      - name: DEVICES
        description: count rlog.zst per device, to see how far the mirror got
    blobStorage:
      bind: true
  - name: CAN lake sink 2
    application: can-lake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: CONSUMER_GROUP
        value: can-lake-sink-v7
      - name: SIGNALS_TABLE
        value: can_signals_v4
      - name: SINK_UNKNOWN_FRAMES
        value: false
      - name: UNKNOWN_TABLE
        value: can_unknown_frames_v3
      - name: HIVE_COLUMNS
        value: platform,device,route,~channel,~sender_node,~frame_name,~signal,~channel_name
      - name: UNKNOWN_HIVE_COLUMNS
        value: platform,device,route,channel
      - name: COMMIT_EVERY
        value: 100000
    blobStorage:
      bind: true
  - name: Quix Lakehouse Sink
    application: quix-lakehouse-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: config-updates
  - name: mf4-metadata
    dataTier: Bronze
  - name: can-raw
    dataTier: Bronze
  - name: can-decoded
    configuration:
      retentionInBytes: 5368709120
    dataTier: Silver
