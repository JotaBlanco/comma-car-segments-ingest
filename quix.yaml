# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MF4 Import
    application: mf4-to-blob
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    publicAccess:
      enabled: true
      urlPrefix: mf4import
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: MF4 Import
        icon: upload_file
        order: 0
    blobStorage:
      bind: true
  - name: MF4 Decoder
    application: mf4-decoder
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2500
    desiredStatus: Running
    variables:
      - name: BATCH_RECORDS
        value: 5000
      - name: DBC_SOURCE
        description: embedded = decode CAN bus-logging files with the DBC attached inside the MF4; none = do not decode.
    blobStorage:
      bind: true
  - name: MF4 DataLake Sink
    application: mf4-datalake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    variables:
      - name: TABLE_NAME
        value: mf4_signals_v3
      - name: HIVE_COLUMNS
        value: '[platform,device,route,~channel_name,~sender_node, ~channel]'
      - name: BATCH_SIZE
        value: 500
      - name: CONSUMER_GROUP
        value: mf4_signals_v1.2
    blobStorage:
      bind: true
  - name: Test Manager - Backend
    group: Test Manager
    application: backend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: backend-api
    network:
      serviceName: test-manager-backend
      ports:
        - port: 80
          targetPort: 8080
    variables:
      - name: MONGO_USER
        description: MongoDB username; must match MONGO_INITDB_ROOT_USERNAME on the MongoDB deployment
      - name: MONGO_PASSWORD
        description: MongoDB password; must match MONGO_INITDB_ROOT_PASSWORD on the MongoDB deployment
        variableKey: mongo_password
      - name: MONGO_HOST
        description: Internal service name of the MongoDB deployment
      - name: CONFIG_API_URL
        description: Dynamic Configuration Manager base URL (its network.serviceName). Required - the backend fails to start without it.
        value: http://config-api-svc
      - name: MEASUREMENTS_URL
        description: Query Builder UI used for the Measurements link. Optional - the endpoint returns 501 when unset.
      - name: DATA_LAKE_V2_TOPIC_NAME
        description: Lakehouse table queried for test measurements. Points at the table this environment's MF4 DataLake Sink writes. Optional - the endpoint returns 501 when unset.
        value: mf4_signals_v2
      - name: ANALYTICS_URL
        description: Marimo notebook UI used for the Analytics link. Optional - the endpoint returns 501 when unset.
    blobStorage:
      bind: true
  - name: Test Manager - Frontend
    group: Test Manager
    application: frontend
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 500
    publicAccess:
      enabled: true
      urlPrefix: frontend-7bdbce0
    network:
      serviceName: test-manager-frontend
      ports:
        - port: 80
          targetPort: 3000
    variables:
      - name: MEASUREMENTS_URL
        description: Query Builder UI URL, mirrored from the backend for parity
    plugin:
      sidebarItem:
        show: true
        label: Test Manager
        icon: data_thresholding
        order: 1
  - name: MongoDB
    group: Aux services
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1500
    state:
      enabled: true
      size: 5
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
    variables:
      - name: MONGO_INITDB_ROOT_USERNAME
        description: The root username to initialize MongoDB with; must match the MONGO_USER secret
      - name: MONGO_INITDB_ROOT_PASSWORD
        description: The root password to initialize MongoDB with; must match the MONGO_PASSWORD secret
      - name: MONGO_DBPATH
        description: WiredTiger data directory. Local disk (EPHEMERAL) because the Quix state mount on this cluster is network-backed and WiredTiger fails on it with EPERM. Only move this under /app/state if that mount becomes block storage.
  - name: Dynamic Configuration Manager
    group: Aux services
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 200
        memory: 500
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: quix
      mongoCollection: configuration-api
  - name: MongoDB Backup Manager
    application: mongodb-backup-manager
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    publicAccess:
      enabled: true
      urlPrefix: backup-manager
    state:
      enabled: true
      size: 1
    network:
      serviceName: backup-manager
      ports:
        - port: 80
          targetPort: 80
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Backup Manager
        icon: save
        order: 0
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: mf4_metadata
  - name: mf4-to-msg
  - name: config-updates
