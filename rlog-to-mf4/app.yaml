name: rlog-to-mf4
language: python
variables:
- name: output
  inputType: OutputTopic
  description: Topic receiving one metadata message per converted MF4 file
  defaultValue: mf4-metadata
  required: true
- name: INPUT_PREFIX
  inputType: FreeText
  description: Blob prefix holding the mirrored rlog segments. The mirror keeps HuggingFace's layout (segments/<device>/<route>/<idx>/rlog.zst)
    - there is no platform directory.
  defaultValue: commacarsegments/segments/
  required: true
- name: OUTPUT_PREFIX
  inputType: FreeText
  description: Blob prefix to write MF4 files under
  defaultValue: mf4/
  required: true
- name: DEVICES
  inputType: FreeText
  description: Optional explicit device-id list, for ad-hoc runs. EMPTY (the default) means every device
    in blob. Prefer PLATFORMS - a hand-written device list is derived data and can drift from the
    dataset. Ignored when it is set alongside PLATFORMS, which wins.
  defaultValue: ''
  required: false
- name: PLATFORMS
  inputType: FreeText
  description: Optional platform filter, comma separated. EMPTY = every vehicle in blob. Expanded to devices
    via the same tables used to resolve each recording, so it cannot disagree with the data. Platform
    itself is never configured - it is looked up per recording from device_platform.json / route_platform.json.
  defaultValue: ''
  required: false
- name: DCM_TYPE
  inputType: FreeText
  description: Dynamic Configuration Manager config type holding the DBC
  defaultValue: dbc
  required: true
- name: DBC_VERSION
  inputType: FreeText
  description: Version label recorded in the MF4 header
  defaultValue: opendbc-0.3.1
  required: false
- name: MAX_SEGMENTS
  inputType: FreeText
  description: Stop after converting this many segments. 0 = no limit (convert every segment the mirror
    has copied). Candidates are drained device by device, so a small value takes everything from the first
    device rather than sampling across the fleet.
  defaultValue: '20'
  required: true
- name: SKIP_EXISTING
  inputType: FreeText
  description: If "true", skip segments whose MF4 already exists at the destination
  defaultValue: 'true'
  required: false
- name: LOGLEVEL
  inputType: FreeText
  description: Python log level
  defaultValue: INFO
  required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
