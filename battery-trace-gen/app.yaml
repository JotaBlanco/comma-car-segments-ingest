name: Battery Sim
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Live signal writes (pedals, ambient, heater, chiller) from Battery Sim UI
    defaultValue: ui-data
    required: true
  - name: output
    inputType: OutputTopic
    description: Pack state, one message per SAMPLE_TIME (0.1 s / 10 Hz)
    defaultValue: battery-data
    required: true
  - name: Q_MAX_AH
    inputType: FreeText
    description: Pack capacity in Ah. Read once at startup into Q_MAX - a change needs a restart, and a live write is refused. 90 Ah is ~70 kWh, so the 250 kW pedal is 3.6C; a smaller pack makes SOC move faster but cooks and empties in minutes, and the temperature derating then throttles discharge. Use TIME_SCALE to speed the sim up instead.
    defaultValue: "90"
    required: false
  - name: A_THERMAL
    inputType: FreeText
    description: Inverse thermal mass in degC/J. Thermal capacity is 1/A_THERMAL and the time constant is that over KE, so the stock 0.0002 gives 5000 J/degC and 52 minutes - far slower than the 25 Ah pack now moves. Tunable, so a live write moves it too
    defaultValue: "0.001"
    required: false
  - name: KE
    inputType: FreeText
    description: Heat exchange to ambient in W/degC. The stock 1.6 pulls only 32 W across a 20 degC gap, so the ambient slider moved the pack 0.4 degC/min and looked dead. Tunable
    defaultValue: "8.0"
    required: false
dockerfile: dockerfile
runEntryPoint: plant/main.py
defaultFile: plant/main.py
