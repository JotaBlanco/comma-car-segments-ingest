name: MF4 Decoder
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Topic carrying MF4 upload metadata
    defaultValue: mf4_metadata
    required: true
  - name: output
    inputType: OutputTopic
    description: Topic to publish decoded per-timestamp messages
    defaultValue: mf4-to-msg
    required: true
  - name: config
    inputType: InputTopic
    description: DCM configuration-events topic. QuixConfigurationService consumes it to
      resolve the CAN database for each file. Required whenever DBC_SOURCE is dcm.
    defaultValue: config-updates
    required: true
  - name: DBC_SOURCE
    inputType: FreeText
    description: Where the CAN database comes from. "dcm" resolves it from the Dynamic
      Configuration Manager by platform, so the database is external and versioned.
      "embedded" uses the DBC attached to the MF4. "none" disables CAN decoding.
    defaultValue: dcm
    required: true
  - name: DCM_TYPE
    inputType: FreeText
    description: Configuration type the databases are stored under. Fixed at pipeline
      build time, so changing it orphans existing lookups.
    defaultValue: dbc
    required: true
  - name: DBC_PLATFORM
    inputType: FreeText
    description: Platform used as the DCM target_key when the metadata message carries
      no platform. The MF4 header states the platform but cannot be read until the file
      is open, which is after the lookup has run - so a deployment ingesting one
      platform names it here.
    defaultValue: FORD_F_150_LIGHTNING_MK1
    required: false
  - name: BATCH_RECORDS
    inputType: FreeText
    description: Records packed into one Kafka message (cluster size). Sink expands them back 1:1.
    defaultValue: 100
  - name: FLUSH_EVERY
    inputType: FreeText
    description: librdkafka producer flush cadence in batches (not samples).
    defaultValue: 1000
  - name: FRAME_CHUNK
    inputType: FreeText
    description: MDF read-chunk size (samples per per-channel slice).
    defaultValue: 1000
  - name: DBC_SOURCE
    inputType: FreeText
    description: >-
      Where the CAN database comes from when the MF4 is a bus-logging file
      (raw CAN_DataFrame.* frames). "embedded" decodes with the DBC attached
      inside the MF4 itself; "none" disables decoding. External DBC fetching
      is not implemented. Bus-logging files that yield no decodable signals
      are dropped - raw frame fields are never written to the signals table.
    defaultValue: embedded
  - name: FORCE_REDECODE
    inputType: FreeText
    description: >-
      Escape hatch for the decode-once filter. "false" (the default) skips a
      file that was already decoded, so a replayed mf4_metadata message is a
      no-op instead of another full copy of that file in the lake. "true"
      decodes every message again, duplicates included - use it only for a
      deliberate re-decode and set it straight back. One file can be forced
      on its own by putting force_redecode=true on its mf4_metadata message,
      which needs no redeploy.
    defaultValue: "false"
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
