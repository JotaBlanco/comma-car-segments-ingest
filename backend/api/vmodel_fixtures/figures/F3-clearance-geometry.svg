<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="100%"
     role="img" aria-labelledby="f3-title f3-desc" font-family="sans-serif" color="#111827">
  <rect class="canvas" x="0" y="0" width="1120" height="700" fill="none"/>
  <title id="f3-title">F3 — Time gap and clearance geometry</title>
  <desc id="f3-desc">Requirements referencing this figure: ACC-SYS-FUN-021, ACC-SYS-FUN-023,
ACC-SYS-PRF-001, ACC-SYS-PRF-002, ACC-SYS-PRF-003. Plan view of the subject vehicle following a
target vehicle in one lane, with the clearance d dimensioned bumper to bumper, the desired
clearance relation MAX(c_min, tau times v), the c_min floor at standstill, and an inset of desired
clearance against subject vehicle speed showing the c_min plateau, the tau times v ramp and the
knee at v equal to c_min divided by tau.</desc>
  <defs>
    <marker id="f3-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="f3-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/>
    </marker>
    <marker id="f3-vt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <text class="ink" x="40" y="36" fill="currentColor" font-size="21" font-weight="bold">F3 — Time gap and clearance geometry</text>
  <text class="ink" x="40" y="58" fill="currentColor" fill-opacity="0.75" font-size="13">Travel direction is left to right. Clearance is measured bumper to bumper, per the ISO 15622:2018 definition.</text>

  <!-- lane -->
  <line class="struct" x1="40" y1="92" x2="1080" y2="92" stroke="currentColor" stroke-opacity="0.65" stroke-width="2"/>
  <line class="struct" x1="40" y1="228" x2="1080" y2="228" stroke="currentColor" stroke-opacity="0.65" stroke-width="2"/>
  <text class="ink" x="46" y="86" fill="currentColor" fill-opacity="0.75" font-size="11.5">subject vehicle lane</text>

  <!-- subject vehicle -->
  <rect x="140" y="130" width="160" height="62" fill="none" stroke="#3B82F6" stroke-width="2.2" rx="8"/>
  <text class="ink" x="220" y="156" fill="currentColor" font-size="13.5" text-anchor="middle">subject vehicle</text>
  <text class="ink" x="220" y="176" fill="#3B82F6" font-size="13" text-anchor="middle">v [m/s]</text>
  <line x1="140" y1="112" x2="252" y2="112" stroke="#3B82F6" stroke-width="2.4" marker-end="url(#f3-v)"/>

  <!-- target vehicle -->
  <rect x="620" y="130" width="160" height="62" fill="none" stroke="#F59E0B" stroke-width="2.2" rx="8"/>
  <text class="ink" x="700" y="156" fill="currentColor" font-size="13.5" text-anchor="middle">target vehicle</text>
  <text class="ink" x="700" y="176" fill="#F59E0B" font-size="13" text-anchor="middle">v_target [m/s]</text>
  <line x1="620" y1="112" x2="732" y2="112" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#f3-vt)"/>

  <!-- further forward vehicle (target selection) -->
  <rect x="900" y="130" width="140" height="62" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.6" stroke-dasharray="6 4" rx="8"/>
  <text class="ink" x="970" y="156" fill="currentColor" fill-opacity="0.75" font-size="12" text-anchor="middle">further forward</text>
  <text class="ink" x="970" y="174" fill="currentColor" fill-opacity="0.75" font-size="12" text-anchor="middle">vehicle</text>
  <text class="ink" x="900" y="212" fill="#10B981" font-size="12">smallest clearance wins · ACC-SYS-FUN-023</text>

  <!-- clearance dimension -->
  <line x1="300" y1="248" x2="620" y2="248" stroke="currentColor" stroke-width="1.6"
        marker-start="url(#f3-dim)" marker-end="url(#f3-dim)"/>
  <line class="struct" x1="300" y1="192" x2="300" y2="258" stroke="currentColor" stroke-opacity="0.65" stroke-width="1" stroke-dasharray="4 3"/>
  <line class="struct" x1="620" y1="192" x2="620" y2="258" stroke="currentColor" stroke-opacity="0.65" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ink" x="460" y="240" fill="currentColor" font-size="13.5" text-anchor="middle">d — clearance [m]</text>
  <text class="ink" x="460" y="272" fill="currentColor" fill-opacity="0.75" font-size="12" text-anchor="middle">time gap tau = d / v [s]</text>

  <!-- relation block -->
  <rect class="struct" x="40" y="296" width="540" height="118" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <text class="ink" x="54" y="320" fill="currentColor" font-size="15" font-weight="bold">Desired clearance</text>
  <text class="ink" x="54" y="346" fill="#10B981" font-size="15">d_desired = MAX(c_min, tau · v)</text>
  <g class="ink" fill="currentColor" font-size="12.5">
    <text x="54" y="370">c_min = 2,5 m — clearance floor, project choice · ACC-SYS-PRF-003</text>
    <text x="54" y="390">tau_min = 0,8 s — minimum selectable time gap · ACC-SYS-PRF-001</text>
    <text x="54" y="408">1,5 s to 2,2 s — at least one selectable setting above 8 m/s · ACC-SYS-PRF-002</text>
  </g>

  <!-- standstill case -->
  <text class="ink" x="40" y="446" fill="currentColor" font-size="14" font-weight="bold">At standstill (v = 0 m/s) the relation collapses to the floor</text>
  <rect x="60" y="462" width="120" height="46" fill="none" stroke="#3B82F6" stroke-width="2" rx="6"/>
  <rect x="250" y="462" width="120" height="46" fill="none" stroke="#F59E0B" stroke-width="2" rx="6"/>
  <line x1="180" y1="530" x2="250" y2="530" stroke="currentColor" stroke-width="1.6"
        marker-start="url(#f3-dim)" marker-end="url(#f3-dim)"/>
  <line class="struct" x1="180" y1="508" x2="180" y2="538" stroke="currentColor" stroke-opacity="0.65" stroke-width="1" stroke-dasharray="4 3"/>
  <line class="struct" x1="250" y1="508" x2="250" y2="538" stroke="currentColor" stroke-opacity="0.65" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ink" x="215" y="556" fill="#A855F7" font-size="13" text-anchor="middle">2,5 m</text>
  <text class="ink" x="390" y="490" fill="currentColor" fill-opacity="0.75" font-size="12">held by automatic brake control in</text>
  <text class="ink" x="390" y="508" fill="currentColor" fill-opacity="0.75" font-size="12">the Active-Hold state · ACC-SYS-PRF-003</text>
  <text class="ink" x="390" y="534" fill="currentColor" fill-opacity="0.75" font-size="12">control-mode arbitration that selects</text>
  <text class="ink" x="390" y="552" fill="currentColor" fill-opacity="0.75" font-size="12">following control · ACC-SYS-FUN-021</text>

  <!-- legend -->
  <rect class="struct" x="40" y="580" width="540" height="96" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <text class="ink" x="54" y="602" fill="currentColor" font-size="14" font-weight="bold">Legend</text>
  <g stroke-width="3">
    <line x1="56" y1="622" x2="90" y2="622" stroke="#3B82F6"/>
    <line x1="56" y1="644" x2="90" y2="644" stroke="#F59E0B"/>
    <line x1="56" y1="666" x2="90" y2="666" stroke="#10B981"/>
    <line x1="330" y1="622" x2="364" y2="622" stroke="#A855F7" stroke-dasharray="6 4"/>
    <line x1="330" y1="644" x2="364" y2="644" stroke="currentColor" stroke-opacity="0.65" stroke-dasharray="6 4"/>
  </g>
  <g class="ink" fill="currentColor" font-size="12.5">
    <text x="98" y="627">subject vehicle</text>
    <text x="98" y="649">target vehicle</text>
    <text x="98" y="671">standards-backed relation or value</text>
    <text x="372" y="627">project-owned value</text>
    <text x="372" y="649">unselected forward vehicle</text>
  </g>

  <!-- inset plot -->
  <text class="ink" x="620" y="316" fill="currentColor" font-size="15" font-weight="bold">Inset — desired clearance against subject vehicle speed</text>
  <text class="ink" x="620" y="336" fill="currentColor" fill-opacity="0.75" font-size="11.5">x axis truncated at 10 m/s; every tau · v ramp continues linearly beyond it</text>
  <rect class="struct" x="640" y="360" width="400" height="240" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2"/>
  <!-- grid -->
  <g class="struct" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.6" stroke-dasharray="3 4">
    <line x1="720" y1="360" x2="720" y2="600"/>
    <line x1="800" y1="360" x2="800" y2="600"/>
    <line x1="880" y1="360" x2="880" y2="600"/>
    <line x1="960" y1="360" x2="960" y2="600"/>
    <line x1="640" y1="550" x2="1040" y2="550"/>
    <line x1="640" y1="500" x2="1040" y2="500"/>
    <line x1="640" y1="450" x2="1040" y2="450"/>
    <line x1="640" y1="400" x2="1040" y2="400"/>
  </g>
  <!-- selectable band 1,5 s to 2,2 s -->
  <path d="M 640 575 L 686 575 L 1040 380 L 1040 450 L 707 575 Z" fill="#F59E0B" fill-opacity="0.18"
        stroke="#F59E0B" stroke-width="1"/>
  <!-- tau = 0,8 s floor curve -->
  <path d="M 640 575 L 765 575 L 1040 520" fill="none" stroke="#10B981" stroke-width="2.4"/>
  <!-- c_min plateau emphasis -->
  <path d="M 640 575 L 765 575" fill="none" stroke="#A855F7" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- knee marker -->
  <circle cx="765" cy="575" r="4" fill="#10B981"/>
  <line class="struct" x1="765" y1="575" x2="765" y2="600" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- axis ticks and labels -->
  <g class="ink" fill="currentColor" font-size="11.5" text-anchor="middle">
    <text x="640" y="618">0</text>
    <text x="720" y="618">2</text>
    <text x="800" y="618">4</text>
    <text x="880" y="618">6</text>
    <text x="960" y="618">8</text>
    <text x="1040" y="618">10</text>
  </g>
  <g class="ink" fill="currentColor" font-size="11.5" text-anchor="end">
    <text x="634" y="604">0</text>
    <text x="634" y="554">5</text>
    <text x="634" y="504">10</text>
    <text x="634" y="454">15</text>
    <text x="634" y="404">20</text>
  </g>
  <text class="ink" x="940" y="638" fill="currentColor" font-size="12.5">v [m/s]</text>
  <text class="ink" x="640" y="352" fill="currentColor" font-size="12.5">d_desired [m]</text>
  <g class="ink" font-size="12">
    <text x="700" y="640" fill="#A855F7">c_min plateau = 2,5 m</text>
    <text x="775" y="568" fill="#10B981">knee at v = c_min / tau</text>
    <text x="860" y="404" fill="#F59E0B">selectable band 1,5 s to 2,2 s</text>
    <text x="880" y="540" fill="#10B981">tau_min = 0,8 s floor</text>
  </g>
</svg>
