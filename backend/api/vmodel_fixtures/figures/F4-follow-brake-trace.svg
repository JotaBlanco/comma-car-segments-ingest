<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="100%"
     role="img" aria-labelledby="f4-title f4-desc" font-family="sans-serif" color="#111827">
  <rect class="canvas" x="0" y="0" width="1120" height="780" fill="none"/>
  <title id="f4-title">F4 — Annotated follow-and-brake trace</title>
  <desc id="f4-desc">Requirements referencing this figure: ACC-SYS-PRF-003, ACC-SYS-PRF-020,
ACC-SYS-PRF-021, ACC-SYS-PRF-042, ACC-SYS-PRF-060, ACC-SYS-SAF-024. Two time-aligned panels. The
upper panel plots subject vehicle speed and target vehicle speed through four segments: steady
following, target braking at 4 m/s², subject deceleration, and clearance re-establishment. The
lower panel plots subject longitudinal acceleration against the same time axis with the
deceleration limit and the jerk limit drawn as bounds; both bounds are UNVERIFIED-2018
engineering assumptions and are drawn dashed.</desc>
  <defs>
    <marker id="f4-tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 5 0 L 5 10" stroke="currentColor" stroke-width="2"/>
    </marker>
  </defs>

  <text class="ink" x="40" y="32" fill="currentColor" font-size="21" font-weight="bold">F4 — Follow, brake and recover: what the performance requirements mean on a trace</text>
  <text class="ink" x="40" y="54" fill="currentColor" fill-opacity="0.75" font-size="13">Scenario geometry is the Euro NCAP car-to-car rear braking case. Bounds drawn dashed in violet are engineering assumptions, not confirmed ISO 15622:2018 values.</text>

  <!-- segment brackets -->
  <g class="struct" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4">
    <path d="M 120 96 L 120 88 L 240 88 L 240 96" fill="none"/>
    <path d="M 240 96 L 240 88 L 510 88 L 510 96" fill="none"/>
    <path d="M 510 96 L 510 88 L 630 88 L 630 96" fill="none"/>
    <path d="M 630 96 L 630 88 L 1050 88 L 1050 96" fill="none"/>
  </g>
  <g class="ink" fill="currentColor" font-size="12.5" text-anchor="middle">
    <text x="180" y="80">1 · steady following</text>
    <text x="375" y="80">2 · target brakes at 4,0 m/s², subject decelerates</text>
    <text x="570" y="80">3 · low-speed following</text>
    <text x="840" y="80">4 · brake release and clearance re-established</text>
  </g>

  <!-- upper panel frame -->
  <rect class="struct" x="120" y="110" width="930" height="220" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2"/>
  <g class="struct" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.6" stroke-dasharray="3 4">
    <line x1="270" y1="110" x2="270" y2="330"/>
    <line x1="420" y1="110" x2="420" y2="330"/>
    <line x1="570" y1="110" x2="570" y2="330"/>
    <line x1="720" y1="110" x2="720" y2="330"/>
    <line x1="870" y1="110" x2="870" y2="330"/>
    <line x1="120" y1="270" x2="1050" y2="270"/>
    <line x1="120" y1="210" x2="1050" y2="210"/>
    <line x1="120" y1="150" x2="1050" y2="150"/>
  </g>
  <text class="ink" x="120" y="104" fill="currentColor" font-size="12.5">v [m/s]</text>
  <g class="ink" fill="currentColor" font-size="11.5" text-anchor="end">
    <text x="114" y="334">0</text>
    <text x="114" y="274">10</text>
    <text x="114" y="214">20</text>
    <text x="114" y="154">30</text>
  </g>

  <!-- target speed -->
  <polyline points="120,132 240,132 450,300 600,300 840,210 1050,210" fill="none"
            stroke="#F59E0B" stroke-width="2.6"/>
  <!-- subject speed -->
  <polyline points="120,132 270,132 510,300 630,300 900,210 1050,210" fill="none"
            stroke="#3B82F6" stroke-width="2.6"/>
  <text class="ink" x="150" y="124" fill="#F59E0B" font-size="12.5">v_target</text>
  <text class="ink" x="640" y="292" fill="#3B82F6" font-size="12.5">v_ego</text>
  <text class="ink" x="256" y="160" fill="currentColor" fill-opacity="0.75" font-size="11.5">120 km/h</text>

  <!-- clearance annotations on upper panel -->
  <text class="ink" x="128" y="322" fill="#10B981" font-size="12">clearance ≥ MAX(2,5 m, tau · v) · ACC-SYS-PRF-003</text>
  <text class="ink" x="516" y="322" fill="#10B981" font-size="12">stop behind a target below 10 m/s · ACC-SYS-PRF-042</text>
  <text class="ink" x="300" y="184" fill="#F59E0B" font-size="12">clearance ≥ 0,5 m throughout · ACC-SYS-PRF-060</text>

  <!-- lower panel frame -->
  <rect class="struct" x="120" y="420" width="930" height="200" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2"/>
  <g class="struct" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.6" stroke-dasharray="3 4">
    <line x1="270" y1="420" x2="270" y2="620"/>
    <line x1="420" y1="420" x2="420" y2="620"/>
    <line x1="570" y1="420" x2="570" y2="620"/>
    <line x1="720" y1="420" x2="720" y2="620"/>
    <line x1="870" y1="420" x2="870" y2="620"/>
    <line x1="120" y1="534" x2="1050" y2="534"/>
    <line x1="120" y1="591" x2="1050" y2="591"/>
  </g>
  <line class="struct" x1="120" y1="477" x2="1050" y2="477" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4"/>
  <text class="ink" x="120" y="414" fill="currentColor" font-size="12.5">a_x_ego [m/s²]</text>
  <g class="ink" fill="currentColor" font-size="11.5" text-anchor="end">
    <text x="114" y="424">+2</text>
    <text x="114" y="481">0</text>
    <text x="114" y="538">−2</text>
    <text x="114" y="595">−4</text>
  </g>

  <!-- deceleration limit bound: UNVERIFIED-2018 -->
  <line x1="120" y1="577" x2="1050" y2="577" stroke="#A855F7" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text class="ink" x="126" y="570" fill="#A855F7" font-size="12">3,5 m/s² over a 2 s moving average · ACC-SYS-PRF-020 · UNVERIFIED-2018</text>

  <!-- jerk bound: UNVERIFIED-2018 -->
  <line x1="270" y1="477" x2="300" y2="548" stroke="#A855F7" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text class="ink" x="306" y="516" fill="#A855F7" font-size="12">2,5 m/s³ over 1 s · ACC-SYS-PRF-021 · UNVERIFIED-2018</text>

  <!-- acceleration trace -->
  <polyline points="120,477 240,477 270,477 312,577 510,577 552,477 630,477 660,429 900,429 930,477 1050,477"
            fill="none" stroke="#3B82F6" stroke-width="2.6"/>

  <!-- brake release annotation -->
  <line class="struct" x1="510" y1="577" x2="510" y2="660" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="552" y1="477" x2="552" y2="660" stroke="#A855F7" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text class="ink" x="516" y="646" fill="#A855F7" font-size="12">release rate ≤ 2,5 m/s³ · ACC-SYS-SAF-024 · UNVERIFIED-2018</text>

  <!-- time axis -->
  <g class="ink" fill="currentColor" font-size="11.5" text-anchor="middle">
    <text x="120" y="636">0</text>
    <text x="270" y="636">5</text>
    <text x="420" y="636">10</text>
    <text x="570" y="636">15</text>
    <text x="720" y="636">20</text>
    <text x="870" y="636">25</text>
    <text x="1020" y="636">30</text>
  </g>
  <text class="ink" x="1000" y="656" fill="currentColor" font-size="12.5">t [s]</text>

  <!-- segment to requirement table -->
  <rect class="struct" x="40" y="668" width="540" height="100" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <text class="ink" x="54" y="690" fill="currentColor" font-size="14" font-weight="bold">Segment · requirements verified</text>
  <g class="ink" fill="currentColor" font-size="12">
    <text x="54" y="712">1 → ACC-SYS-PRF-003</text>
    <text x="54" y="730">2 → ACC-SYS-PRF-060, ACC-SYS-PRF-020, ACC-SYS-PRF-021</text>
    <text x="54" y="748">3 → ACC-SYS-PRF-042</text>
    <text x="54" y="764">4 → ACC-SYS-SAF-024, ACC-SYS-PRF-003</text>
  </g>

  <!-- legend -->
  <rect class="struct" x="600" y="668" width="490" height="100" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <text class="ink" x="614" y="690" fill="currentColor" font-size="14" font-weight="bold">Legend</text>
  <g stroke-width="3">
    <line x1="616" y1="708" x2="650" y2="708" stroke="#3B82F6"/>
    <line x1="616" y1="730" x2="650" y2="730" stroke="#F59E0B"/>
    <line x1="616" y1="752" x2="650" y2="752" stroke="#A855F7" stroke-dasharray="6 4"/>
  </g>
  <g class="ink" fill="currentColor" font-size="12.5">
    <text x="658" y="713">subject vehicle speed and longitudinal acceleration</text>
    <text x="658" y="735">target vehicle speed</text>
    <text x="658" y="757">bound whose value is an UNVERIFIED-2018 assumption</text>
  </g>
</svg>
