<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="100%"
     role="img" aria-labelledby="f2-title f2-desc" font-family="sans-serif" color="#111827">
  <rect class="canvas" x="0" y="0" width="1120" height="820" fill="none"/>
  <title id="f2-title">F2 — ACC state machine</title>
  <desc id="f2-desc">Requirements referencing this figure: ACC-SYS-FUN-001, ACC-SYS-FUN-002,
ACC-SYS-FUN-003, ACC-SYS-FUN-004, ACC-SYS-FUN-005, ACC-SYS-FUN-006, ACC-SYS-FUN-021,
ACC-SYS-FUN-022, ACC-SYS-FUN-041, ACC-SYS-FUN-042, ACC-SYS-SAF-004, ACC-SYS-SAF-021,
ACC-SYS-SAF-022, ACC-SYS-SAF-023, ACC-SYS-SAF-042, ACC-SYS-SAF-060. Seven states: Off, Standby,
Active-Cruise, Active-Follow, Active-Hold, Driver-Override, Degraded-Fault. Every transition arc
carries its trigger and the identifier of the one requirement that specifies it; arc labels
abbreviate ACC-SYS-GRP-nnn to GRP-nnn.</desc>
  <defs>
    <marker id="f2-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
    <marker id="f2-cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/>
    </marker>
    <marker id="f2-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
  </defs>

  <text class="ink" x="40" y="36" fill="currentColor" font-size="21" font-weight="bold">F2 — ACC state machine, seven states</text>
  <text class="ink" x="40" y="58" fill="currentColor" fill-opacity="0.75" font-size="13">Every arc carries its trigger and the requirement that specifies it. An arc with no requirement identifier would be a defect.</text>

  <!-- Off and Standby -->
  <rect class="boxfill struct" x="40" y="100" width="150" height="64" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.6" rx="8"/>
  <rect class="boxfill struct" x="290" y="100" width="150" height="64" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.6" rx="8"/>
  <text class="ink" x="115" y="139" fill="currentColor" font-size="15" text-anchor="middle" font-weight="bold">Off</text>
  <text class="ink" x="365" y="139" fill="currentColor" font-size="15" text-anchor="middle" font-weight="bold">Standby</text>

  <!-- active group -->
  <rect class="struct" x="40" y="250" width="560" height="430" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" stroke-dasharray="8 6" rx="12"/>
  <text class="ink" x="52" y="272" fill="currentColor" fill-opacity="0.75" font-size="13">Active group — ACC controls longitudinal motion</text>

  <rect class="boxfill struct" x="80" y="300" width="200" height="64" fill="none" stroke="#3B82F6" stroke-width="1.8" rx="8"/>
  <rect class="boxfill struct" x="80" y="430" width="200" height="64" fill="none" stroke="#3B82F6" stroke-width="1.8" rx="8"/>
  <rect class="boxfill struct" x="80" y="560" width="200" height="64" fill="none" stroke="#3B82F6" stroke-width="1.8" rx="8"/>
  <rect class="boxfill struct" x="380" y="300" width="180" height="64" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.6" rx="8"/>
  <text class="ink" x="180" y="339" fill="currentColor" font-size="15" text-anchor="middle" font-weight="bold">Active-Cruise</text>
  <text class="ink" x="180" y="469" fill="currentColor" font-size="15" text-anchor="middle" font-weight="bold">Active-Follow</text>
  <text class="ink" x="180" y="592" fill="currentColor" font-size="15" text-anchor="middle" font-weight="bold">Active-Hold</text>
  <text class="ink" x="180" y="612" fill="currentColor" fill-opacity="0.75" font-size="11.5" text-anchor="middle">standstill, brake held</text>
  <text class="ink" x="470" y="339" fill="currentColor" font-size="15" text-anchor="middle" font-weight="bold">Driver-Override</text>

  <!-- Degraded-Fault -->
  <rect class="boxfill struct" x="780" y="470" width="220" height="80" fill="none" stroke="#EF4444" stroke-width="2" rx="8"/>
  <text class="ink" x="890" y="505" fill="currentColor" font-size="15" text-anchor="middle" font-weight="bold">Degraded-Fault</text>
  <text class="ink" x="890" y="527" fill="currentColor" fill-opacity="0.75" font-size="11.5" text-anchor="middle">no automatic longitudinal control</text>

  <!-- arcs: driver-commanded nominal (blue) -->
  <g fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#f2-cmd)">
    <path d="M 190 120 L 288 120"/>
    <path d="M 290 150 L 192 150"/>
    <path d="M 365 164 L 365 240 L 180 240 L 180 298"/>
    <path d="M 220 560 L 220 496"/>
    <path d="M 280 462 L 620 462 L 620 196 L 380 196 L 380 166"/>
  </g>

  <!-- arcs: automatic nominal (green) -->
  <g fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#f2-ok)">
    <path d="M 140 364 L 140 428"/>
    <path d="M 220 430 L 220 366"/>
    <path d="M 140 494 L 140 558"/>
    <path d="M 280 316 L 378 316"/>
    <path d="M 380 348 L 282 348"/>
    <path d="M 890 470 L 890 132 L 442 132"/>
  </g>

  <!-- arcs: fault (red) -->
  <g fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#f2-fault)">
    <path d="M 280 576 L 700 576 L 700 510 L 778 510"/>
    <path d="M 280 608 L 740 608 L 740 540 L 778 540"/>
    <path d="M 1000 486 L 1046 486 L 1046 534 L 1002 534"/>
  </g>

  <!-- arc labels -->
  <g class="ink" fill="currentColor" font-size="12.5">
    <text x="196" y="90">ignition on · FUN-002</text>
    <text x="196" y="196">ignition off · FUN-003</text>
    <text x="196" y="232">set switch · FUN-004</text>
    <text x="146" y="388">target present,</text>
    <text x="146" y="404">lower speed · FUN-022</text>
    <text x="292" y="388">no target or</text>
    <text x="292" y="404">set speed lower · FUN-022</text>
    <text x="146" y="424" fill="#F59E0B">arbitration: whichever speed is lower · FUN-021</text>
    <text x="290" y="290">accelerator torque &gt; ACC request · FUN-041</text>
    <text x="290" y="382" fill="#10B981">accelerator released · FUN-041</text>
    <text x="146" y="518">standstill,</text>
    <text x="146" y="534">≤ 3 s · FUN-005</text>
    <text x="292" y="518">resume switch</text>
    <text x="292" y="534">FUN-006</text>
    <text x="628" y="300">brake pedal or</text>
    <text x="628" y="318">cancel switch · FUN-042</text>
    <text x="628" y="336" fill="currentColor" fill-opacity="0.75" font-size="11.5">(from every active state)</text>
    <text x="292" y="566" font-size="12" fill="#EF4444">forward sensing lost &gt; 500 ms · SAF-021</text>
    <text x="292" y="628" font-size="12" fill="#EF4444">bus or actuation fault · SAF-022</text>
    <text x="292" y="648" font-size="12" fill="#F59E0B">hands-off escalation before 10 km/h · SAF-060</text>
    <text x="900" y="300" fill="#10B981">no fault ≤ 500 ms</text>
    <text x="900" y="318" fill="#10B981">SAF-023</text>
    <text x="790" y="574" font-size="12" fill="#EF4444">set switch ignored · SAF-042</text>
    <text x="790" y="592" font-size="12" fill="#EF4444">fault indication ≤ 500 ms · SAF-004</text>
  </g>

  <!-- notes -->
  <rect class="struct" x="620" y="612" width="470" height="66" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <g class="ink" fill="currentColor" fill-opacity="0.75" font-size="11.5">
    <text x="632" y="632">FUN-001 fixes the state set. FUN-003 applies from every state; drawn once, from Standby.</text>
    <text x="632" y="650">FUN-021 is the arbitration rule of the Cruise / Follow pair, not a transition of its own.</text>
    <text x="632" y="668">Arc labels abbreviate ACC-SYS-GRP-nnn to GRP-nnn. Full identifiers are in the figure description.</text>
  </g>

  <!-- legend -->
  <rect class="struct" x="40" y="700" width="1050" height="100" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <text class="ink" x="54" y="724" fill="currentColor" font-size="14" font-weight="bold">Legend</text>
  <g stroke-width="3">
    <line x1="56" y1="746" x2="94" y2="746" stroke="#3B82F6"/>
    <line x1="56" y1="770" x2="94" y2="770" stroke="#10B981"/>
    <line x1="560" y1="746" x2="598" y2="746" stroke="#EF4444"/>
    <line x1="560" y1="770" x2="598" y2="770" stroke="#F59E0B"/>
  </g>
  <g class="ink" fill="currentColor" font-size="12.5">
    <text x="104" y="751">nominal transition commanded by the driver</text>
    <text x="104" y="775">nominal transition made automatically by the ACC system</text>
    <text x="608" y="751">transition whose trigger is a detected fault, and fault-state annotation</text>
    <text x="608" y="775">rule or warning annotation attached to a state rather than to one arc</text>
  </g>
</svg>
