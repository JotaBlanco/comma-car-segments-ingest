<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="100%"
     role="img" aria-labelledby="f5-title f5-desc" font-family="sans-serif" color="#111827">
  <rect class="canvas" x="0" y="0" width="1120" height="820" fill="none"/>
  <title id="f5-title">F5 — Cut-in and cut-out geometry</title>
  <desc id="f5-desc">Requirements referencing this figure: ACC-SYS-FUN-023, ACC-SYS-PRF-061,
ACC-SYS-PRF-062. Two stacked plan views. The upper view is the cut-in case: a vehicle performs a
full lane change into the lane of the vehicle under test with a 3,5 m lateral offset, with the two
Euro NCAP parameter sets and the reference instants at a time to collision of 1,50 s and 0,00 s.
The lower view is the cut-out case: the lead vehicle performs a full lane change out of the lane
revealing a stationary vehicle, with the reference instant at a time to collision of 3,00 s and a
path deviation tolerance of plus or minus 0,2 m. Every parameter value is from Euro NCAP AD v2.2
(2024-09).</desc>
  <defs>
    <marker id="f5-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="f5-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <pattern id="f5-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.6"/>
    </pattern>
  </defs>

  <text class="ink" x="40" y="32" fill="currentColor" font-size="21" font-weight="bold">F5 — Cut-in and cut-out geometry</text>
  <text class="ink" x="40" y="54" fill="currentColor" fill-opacity="0.75" font-size="13">All parameter values: Euro NCAP Assisted Driving Test &amp; Assessment Protocol v2.2 (2024-09). Travel direction left to right.</text>

  <!-- ===================== UPPER: CUT-IN ===================== -->
  <text class="ink" x="40" y="84" fill="#3B82F6" font-size="16" font-weight="bold">Cut-in — a forward vehicle enters the lane of the VUT</text>

  <!-- lanes -->
  <line class="struct" x1="40" y1="106" x2="1080" y2="106" stroke="currentColor" stroke-opacity="0.65" stroke-width="2"/>
  <line class="struct" x1="40" y1="192" x2="1080" y2="192" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" stroke-dasharray="18 14"/>
  <line class="struct" x1="40" y1="284" x2="1080" y2="284" stroke="currentColor" stroke-opacity="0.65" stroke-width="2"/>
  <text class="ink" x="46" y="122" fill="currentColor" fill-opacity="0.75" font-size="11.5">adjacent lane</text>
  <text class="ink" x="46" y="278" fill="currentColor" fill-opacity="0.75" font-size="11.5">VUT lane</text>

  <!-- VUT -->
  <rect x="80" y="214" width="124" height="52" fill="none" stroke="#3B82F6" stroke-width="2.2" rx="7"/>
  <text class="ink" x="142" y="236" fill="currentColor" font-size="12.5" text-anchor="middle">VUT</text>
  <text class="ink" x="142" y="254" fill="#3B82F6" font-size="11.5" text-anchor="middle">subject vehicle</text>

  <!-- GVT before the lane change -->
  <rect x="470" y="124" width="116" height="48" fill="none" stroke="#F59E0B" stroke-width="2.2" rx="7"/>
  <text class="ink" x="528" y="146" fill="currentColor" font-size="12.5" text-anchor="middle">GVT</text>
  <text class="ink" x="528" y="163" fill="#F59E0B" font-size="11" text-anchor="middle">before</text>

  <!-- GVT after the lane change -->
  <rect x="700" y="216" width="116" height="48" fill="none" stroke="#F59E0B" stroke-width="1.8"
        stroke-dasharray="6 4" rx="7"/>
  <text class="ink" x="758" y="238" fill="#F59E0B" font-size="12.5" text-anchor="middle">GVT</text>
  <text class="ink" x="758" y="255" fill="#F59E0B" font-size="11" text-anchor="middle">after</text>

  <!-- lane change path -->
  <path d="M 586 148 C 630 148, 646 240, 696 240" fill="none" stroke="#F59E0B" stroke-width="2.4"
        marker-end="url(#f5-path)"/>

  <!-- 3,5 m lateral offset -->
  <line x1="420" y1="148" x2="420" y2="240" stroke="currentColor" stroke-width="1.6"
        marker-start="url(#f5-dim)" marker-end="url(#f5-dim)"/>
  <line class="struct" x1="410" y1="148" x2="586" y2="148" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line class="struct" x1="410" y1="240" x2="700" y2="240" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text class="ink" x="352" y="198" fill="currentColor" font-size="12.5">3,5 m</text>

  <!-- TTC reference instants -->
  <line x1="586" y1="100" x2="586" y2="296" stroke="#10B981" stroke-width="1.6" stroke-dasharray="7 5"/>
  <line x1="758" y1="100" x2="758" y2="296" stroke="#10B981" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text class="ink" x="592" y="100" fill="#10B981" font-size="12">TTC = 1,50 s</text>
  <text class="ink" x="764" y="100" fill="#10B981" font-size="12">TTC = 0,00 s</text>

  <!-- requirement annotations -->
  <text class="ink" x="212" y="306" fill="#10B981" font-size="12">the vehicle entering the lane becomes the forward vehicle with the smallest clearance · ACC-SYS-FUN-023</text>
  <text class="ink" x="212" y="324" fill="#10B981" font-size="12">selection completed within 0,5 s of lane change completion · ACC-SYS-PRF-062</text>

  <!-- parameter box, cut-in -->
  <rect class="struct" x="852" y="112" width="230" height="176" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <text class="ink" x="864" y="132" fill="currentColor" font-size="13" font-weight="bold">Cut-in parameters</text>
  <g class="ink" fill="currentColor" font-size="11.5">
    <text x="864" y="152">lateral offset 3,5 m (full lane change)</text>
    <text x="864" y="172">set A: 0,5 m/s², 14,5 m, R = 15 m</text>
    <text x="864" y="190">set B: 1,5 m/s², 60,0 m, R = 250 m</text>
    <text x="864" y="212">speed pairs, VUT / GVT:</text>
    <text x="864" y="230">50 km/h / 10 km/h</text>
    <text x="864" y="248">120 km/h / 70 km/h</text>
    <text x="864" y="270" fill="currentColor" fill-opacity="0.75">reference instants TTC = 0,00 s</text>
    <text x="864" y="284" fill="currentColor" fill-opacity="0.75">and TTC = 1,50 s, 100 % overlap</text>
  </g>

  <!-- ===================== LOWER: CUT-OUT ===================== -->
  <text class="ink" x="40" y="400" fill="#F59E0B" font-size="16" font-weight="bold">Cut-out — the target vehicle leaves the lane, revealing a stationary vehicle</text>

  <line class="struct" x1="40" y1="422" x2="1080" y2="422" stroke="currentColor" stroke-opacity="0.65" stroke-width="2"/>
  <line class="struct" x1="40" y1="508" x2="1080" y2="508" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" stroke-dasharray="18 14"/>
  <line class="struct" x1="40" y1="600" x2="1080" y2="600" stroke="currentColor" stroke-opacity="0.65" stroke-width="2"/>
  <text class="ink" x="46" y="438" fill="currentColor" fill-opacity="0.75" font-size="11.5">adjacent lane</text>
  <text class="ink" x="46" y="594" fill="currentColor" fill-opacity="0.75" font-size="11.5">VUT lane</text>

  <!-- VUT -->
  <rect x="80" y="530" width="124" height="52" fill="none" stroke="#3B82F6" stroke-width="2.2" rx="7"/>
  <text class="ink" x="142" y="552" fill="currentColor" font-size="12.5" text-anchor="middle">VUT</text>
  <text class="ink" x="142" y="570" fill="#3B82F6" font-size="11.5" text-anchor="middle">subject vehicle</text>

  <!-- SOV before -->
  <rect x="390" y="532" width="116" height="48" fill="none" stroke="#F59E0B" stroke-width="2.2" rx="7"/>
  <text class="ink" x="448" y="554" fill="currentColor" font-size="12.5" text-anchor="middle">SOV</text>
  <text class="ink" x="448" y="571" fill="#F59E0B" font-size="11" text-anchor="middle">target, before</text>

  <!-- SOV after -->
  <rect x="620" y="440" width="116" height="48" fill="none" stroke="#F59E0B" stroke-width="1.8"
        stroke-dasharray="6 4" rx="7"/>
  <text class="ink" x="678" y="462" fill="#F59E0B" font-size="12.5" text-anchor="middle">SOV</text>
  <text class="ink" x="678" y="479" fill="#F59E0B" font-size="11" text-anchor="middle">after</text>

  <!-- lane change path out -->
  <path d="M 506 556 C 550 556, 566 464, 616 464" fill="none" stroke="#F59E0B" stroke-width="2.4"
        marker-end="url(#f5-path)"/>
  <text class="ink" x="512" y="612" fill="currentColor" fill-opacity="0.75" font-size="11.5">path deviation tolerance ± 0,2 m</text>

  <!-- stationary vehicle revealed -->
  <rect x="880" y="530" width="124" height="52" fill="url(#f5-hatch)" stroke="#EF4444" stroke-width="2.2" rx="7"/>
  <text class="ink" x="942" y="522" fill="#EF4444" font-size="12.5" text-anchor="middle">stationary vehicle</text>

  <!-- 3,5 m offset -->
  <line x1="800" y1="464" x2="800" y2="556" stroke="currentColor" stroke-width="1.6"
        marker-start="url(#f5-dim)" marker-end="url(#f5-dim)"/>
  <line class="struct" x1="736" y1="464" x2="810" y2="464" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line class="struct" x1="506" y1="556" x2="810" y2="556" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text class="ink" x="812" y="514" fill="currentColor" font-size="12.5">3,5 m</text>

  <!-- clearance to the stationary vehicle -->
  <line x1="204" y1="640" x2="880" y2="640" stroke="currentColor" stroke-width="1.4"
        marker-start="url(#f5-dim)" marker-end="url(#f5-dim)"/>
  <text class="ink" x="542" y="632" fill="currentColor" font-size="12" text-anchor="middle">clearance to the revealed stationary vehicle</text>
  <text class="ink" x="542" y="660" fill="#10B981" font-size="12" text-anchor="middle">≥ 0,5 m at all times after the cut-out · ACC-SYS-PRF-061</text>

  <!-- TTC marker -->
  <line x1="506" y1="416" x2="506" y2="612" stroke="#10B981" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text class="ink" x="512" y="414" fill="#10B981" font-size="12">TTC = 3,00 s (SOV to the stationary vehicle, at lane change start)</text>

  <!-- parameter box, cut-out -->
  <rect class="struct" x="852" y="676" width="230" height="118" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <text class="ink" x="864" y="696" fill="currentColor" font-size="13" font-weight="bold">Cut-out parameters</text>
  <g class="ink" fill="currentColor" font-size="11.5">
    <text x="864" y="716">lateral offset 3,5 m</text>
    <text x="864" y="734">set A: 70 / 50 km/h, 1,5 m/s², 44,0 m, R = 130 m</text>
    <text x="864" y="752">set B: 90 / 70 km/h, 1,5 m/s², 60,0 m, R = 250 m</text>
    <text x="864" y="770">SOV path deviation ± 0,2 m</text>
    <text x="864" y="788" fill="currentColor" fill-opacity="0.75">reference instant TTC = 3,00 s</text>
  </g>

  <!-- legend -->
  <rect class="struct" x="40" y="676" width="780" height="118" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <text class="ink" x="54" y="696" fill="currentColor" font-size="14" font-weight="bold">Legend</text>
  <g stroke-width="3">
    <line x1="56" y1="716" x2="90" y2="716" stroke="#3B82F6"/>
    <line x1="56" y1="738" x2="90" y2="738" stroke="#F59E0B"/>
    <line x1="56" y1="760" x2="90" y2="760" stroke="#EF4444"/>
    <line x1="440" y1="716" x2="474" y2="716" stroke="#10B981" stroke-dasharray="7 5"/>
    <line x1="440" y1="738" x2="474" y2="738" stroke="#F59E0B" stroke-dasharray="6 4"/>
    <line x1="440" y1="760" x2="474" y2="760" stroke="currentColor" stroke-opacity="0.65" stroke-dasharray="4 3"/>
  </g>
  <g class="ink" fill="currentColor" font-size="12.5">
    <text x="98" y="721">VUT, the subject vehicle carrying the ACC system</text>
    <text x="98" y="743">GVT or SOV, the vehicle performing the lane change</text>
    <text x="98" y="765">stationary vehicle revealed by the cut-out</text>
    <text x="482" y="721">reference instant and requirement annotation</text>
    <text x="482" y="743">vehicle position after the lane change</text>
    <text x="482" y="765">construction and dimension line</text>
  </g>
</svg>
