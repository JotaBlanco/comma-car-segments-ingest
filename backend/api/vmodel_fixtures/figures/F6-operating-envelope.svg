<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="100%"
     role="img" aria-labelledby="f6-title f6-desc" font-family="sans-serif" color="#111827">
  <rect class="canvas" x="0" y="0" width="1120" height="720" fill="none"/>
  <title id="f6-title">F6 — ACC operating envelope</title>
  <desc id="f6-desc">Requirements referencing this figure: ACC-SYS-PRF-020, ACC-SYS-PRF-021,
ACC-SYS-PRF-022, ACC-SYS-PRF-040, ACC-SYS-PRF-041, ACC-SYS-PRF-042, ACC-SYS-SAF-040,
ACC-SYS-SAF-041. Subject vehicle speed on the x axis against longitudinal acceleration on the y
axis, with the permissible operating region shaded. Every bound is annotated with its verification
tag. Bounds tagged UNVERIFIED-2018 are drawn dashed in violet and carry the literal tag text;
bounds read verbatim from a primary source are drawn solid.</desc>
  <text class="ink" x="40" y="32" fill="currentColor" font-size="21" font-weight="bold">F6 — ACC operating envelope, with the provenance of every bound</text>
  <text class="ink" x="40" y="54" fill="currentColor" fill-opacity="0.75" font-size="13">Read this figure first. Dashed violet bounds are engineering assumptions from a superseded edition, not confirmed ISO 15622:2018 values.</text>

  <!-- shaded regions -->
  <rect x="140" y="167" width="900" height="256" fill="#10B981" fill-opacity="0.12"/>
  <rect x="140" y="423" width="900" height="70" fill="#F59E0B" fill-opacity="0.14"/>
  <rect x="140" y="493" width="900" height="47" fill="#EF4444" fill-opacity="0.16"/>

  <!-- plot frame and grid -->
  <rect class="struct" x="140" y="120" width="900" height="420" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2"/>
  <g class="struct" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.6" stroke-dasharray="3 4">
    <line x1="320" y1="120" x2="320" y2="540"/>
    <line x1="500" y1="120" x2="500" y2="540"/>
    <line x1="680" y1="120" x2="680" y2="540"/>
    <line x1="860" y1="120" x2="860" y2="540"/>
    <line x1="140" y1="353" x2="1040" y2="353"/>
    <line x1="140" y1="447" x2="1040" y2="447"/>
  </g>
  <line class="struct" x1="140" y1="260" x2="1040" y2="260" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.6"/>

  <!-- horizontal bounds -->
  <!-- +2,0 m/s^2 acceleration ceiling, UNVERIFIED-2018 -->
  <line x1="140" y1="167" x2="1040" y2="167" stroke="#A855F7" stroke-width="2.6" stroke-dasharray="6 4"/>
  <text class="ink" x="148" y="159" fill="#A855F7" font-size="12.5">+2,0 m/s² automatic acceleration ceiling · ACC-SYS-PRF-022 · UNVERIFIED-2018</text>

  <!-- -3,5 m/s^2 deceleration floor, UNVERIFIED-2018 -->
  <line x1="140" y1="423" x2="1040" y2="423" stroke="#A855F7" stroke-width="2.6" stroke-dasharray="6 4"/>
  <text class="ink" x="148" y="415" fill="#A855F7" font-size="12.5">−3,5 m/s² automatic deceleration, 2 s moving average · ACC-SYS-PRF-020 · UNVERIFIED-2018</text>

  <!-- -5,0 m/s^2 authority ceiling, project choice -->
  <line x1="140" y1="493" x2="1040" y2="493" stroke="#EF4444" stroke-width="2.8"/>
  <text class="ink" x="148" y="486" fill="#EF4444" font-size="12.5">−5,0 m/s² ACC deceleration authority ceiling · ACC-SYS-SAF-040 · PROJECT-CHOICE</text>
  <text class="ink" x="148" y="516" fill="#EF4444" font-size="12.5">below this line the autonomous emergency braking system owns the brake actuator · ACC-SYS-SAF-041</text>

  <!-- region labels -->
  <text class="ink" x="600" y="300" fill="#10B981" font-size="15" font-weight="bold" text-anchor="middle">permissible ACC operating region</text>
  <text class="ink" x="600" y="322" fill="currentColor" fill-opacity="0.75" font-size="12" text-anchor="middle">steady-state and nominal transient operation</text>
  <text class="ink" x="820" y="452" fill="#F59E0B" font-size="12.5">transient band: instantaneous deceleration may exceed the 2 s average bound</text>

  <!-- jerk annotation on the deceleration bound -->
  <line x1="380" y1="353" x2="420" y2="423" stroke="#A855F7" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text class="ink" x="426" y="384" fill="#A855F7" font-size="12">approach to the bound rate-limited to 2,5 m/s³ over 1 s · ACC-SYS-PRF-021 · UNVERIFIED-2018</text>

  <!-- vertical speed bounds -->
  <!-- v_low = 5 m/s, deliberately not a requirement -->
  <line x1="230" y1="120" x2="230" y2="540" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text class="ink" x="236" y="576" fill="currentColor" fill-opacity="0.75" font-size="11.5">v_low = 5 m/s</text>
  <text class="ink" x="236" y="590" fill="currentColor" fill-opacity="0.75" font-size="11.5">not carried into a requirement (FSRA)</text>

  <!-- 8 m/s gap-setting threshold, VERIFIED-PRIMARY -->
  <line x1="284" y1="120" x2="284" y2="423" stroke="#10B981" stroke-width="2.4"/>
  <text class="ink" x="290" y="140" fill="#10B981" font-size="12">8 m/s — above this speed at least one</text>
  <text class="ink" x="290" y="154" fill="#10B981" font-size="12">1,5 s to 2,2 s gap setting is selectable</text>
  <text class="ink" x="290" y="168" fill="#10B981" font-size="12">VERIFIED-PRIMARY</text>

  <!-- v_set_min = 7 m/s, UNVERIFIED-2018 -->
  <line x1="266" y1="167" x2="266" y2="540" stroke="#A855F7" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text class="ink" x="272" y="212" fill="#A855F7" font-size="12">v_set_min = 7 m/s · ACC-SYS-PRF-040</text>
  <text class="ink" x="272" y="226" fill="#A855F7" font-size="12">UNVERIFIED-2018</text>

  <!-- v_stopping = 10 m/s, VERIFIED-PRIMARY -->
  <line x1="320" y1="167" x2="320" y2="540" stroke="#10B981" stroke-width="2.4"/>
  <text class="ink" x="326" y="250" fill="#10B981" font-size="12">v_stopping = 10 m/s — stop-behind capability applies</text>
  <text class="ink" x="326" y="264" fill="#10B981" font-size="12">below this target speed · ACC-SYS-PRF-042 · VERIFIED-PRIMARY</text>

  <!-- v_set_max = 180 km/h, project choice -->
  <line x1="1040" y1="120" x2="1040" y2="540" stroke="#3B82F6" stroke-width="2.8"/>
  <text class="ink" x="1034" y="112" fill="#3B82F6" font-size="12" text-anchor="end">v_set_max = 180 km/h · ACC-SYS-PRF-041 · PROJECT-CHOICE</text>

  <!-- standstill annotation -->
  <text class="ink" x="148" y="238" fill="currentColor" font-size="12">automatic positive acceleration is</text>
  <text class="ink" x="148" y="252" fill="currentColor" font-size="12">permitted from standstill (FSRA)</text>
  <line class="struct" x1="140" y1="260" x2="176" y2="260" stroke="#3B82F6" stroke-width="3"/>

  <!-- axes labels -->
  <g class="ink" fill="currentColor" font-size="11.5" text-anchor="middle">
    <text x="140" y="558">0</text>
    <text x="320" y="558">10</text>
    <text x="500" y="558">20</text>
    <text x="680" y="558">30</text>
    <text x="860" y="558">40</text>
    <text x="1040" y="558">50</text>
  </g>
  <g class="ink" fill="currentColor" fill-opacity="0.75" font-size="11" text-anchor="middle">
    <text x="140" y="608">0</text>
    <text x="320" y="608">36</text>
    <text x="500" y="608">72</text>
    <text x="680" y="608">108</text>
    <text x="860" y="608">144</text>
    <text x="1040" y="608">180</text>
  </g>
  <text class="ink" x="600" y="628" fill="currentColor" font-size="12.5" text-anchor="middle">subject vehicle speed — upper row m/s, lower row km/h</text>
  <g class="ink" fill="currentColor" font-size="11.5" text-anchor="end">
    <text x="134" y="171">+2</text>
    <text x="134" y="264">0</text>
    <text x="134" y="357">−2</text>
    <text x="134" y="451">−4</text>
    <text x="134" y="544">−6</text>
  </g>
  <text class="ink" x="140" y="110" fill="currentColor" font-size="12.5">a_x_ego [m/s²]</text>

  <!-- legend -->
  <rect class="struct" x="40" y="640" width="1040" height="70" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <g stroke-width="3">
    <line x1="56" y1="662" x2="94" y2="662" stroke="#10B981"/>
    <line x1="56" y1="688" x2="94" y2="688" stroke="#A855F7" stroke-dasharray="6 4"/>
    <line x1="560" y1="662" x2="598" y2="662" stroke="#EF4444"/>
    <line x1="560" y1="688" x2="598" y2="688" stroke="#3B82F6"/>
  </g>
  <g class="ink" fill="currentColor" font-size="12.5">
    <text x="104" y="667">solid green — value read verbatim from a primary source (VERIFIED-PRIMARY)</text>
    <text x="104" y="693">dashed violet — engineering assumption from a superseded edition (UNVERIFIED-2018)</text>
    <text x="608" y="667">solid red — hazard-bounding authority limit owned by the project</text>
    <text x="608" y="693">solid blue — envelope limit owned by the project (PROJECT-CHOICE)</text>
  </g>
</svg>
