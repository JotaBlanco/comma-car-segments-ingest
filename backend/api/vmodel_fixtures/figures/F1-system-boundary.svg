<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="100%"
     role="img" aria-labelledby="f1-title f1-desc" font-family="sans-serif" color="#111827">
  <rect class="canvas" x="0" y="0" width="1120" height="760" fill="none"/>
  <title id="f1-title">F1 — System boundary block diagram</title>
  <desc id="f1-desc">Requirements referencing this figure: ACC-SYS-FUN-041, ACC-SYS-FUN-042,
ACC-SYS-FUN-060, ACC-SYS-FUN-061, ACC-SYS-SAF-001, ACC-SYS-SAF-002, ACC-SYS-SAF-003,
ACC-SYS-SAF-004, ACC-SYS-SAF-021, ACC-SYS-SAF-040, ACC-SYS-SAF-041. The figure fixes what is
inside the ACC system versus outside it, and names every signal crossing the boundary. Signal
names shown on the arrows are the measurand values used by the requirement register.</desc>
  <defs>
    <marker id="f1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" fill-opacity="0.75"/>
    </marker>
    <marker id="f1-arrow-ego" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/>
    </marker>
    <marker id="f1-arrow-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
    <marker id="f1-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <text class="ink" x="40" y="36" fill="currentColor" font-size="21" font-weight="bold">F1 — ACC system boundary</text>
  <text class="ink" x="40" y="58" fill="currentColor" fill-opacity="0.75" font-size="13">Inside the box is the ACC system. Arrow labels are the signal names used in the measurand attribute.</text>

  <!-- system boundary -->
  <rect class="struct" x="300" y="86" width="470" height="470" fill="none" stroke="#3B82F6"
        stroke-width="2.5" stroke-dasharray="10 6" rx="10"/>
  <text class="ink" x="316" y="110" fill="#3B82F6" font-size="15" font-weight="bold">ACC system (system boundary)</text>

  <!-- internal blocks -->
  <g stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5">
    <rect class="boxfill struct" x="322" y="132" width="196" height="58" fill="none" rx="6"/>
    <rect class="boxfill struct" x="322" y="216" width="196" height="58" fill="none" rx="6"/>
    <rect class="boxfill struct" x="322" y="300" width="196" height="58" fill="none" rx="6"/>
    <rect class="boxfill struct" x="552" y="132" width="196" height="58" fill="none" rx="6"/>
    <rect class="boxfill struct" x="552" y="216" width="196" height="58" fill="none" rx="6"/>
    <rect class="boxfill struct" x="552" y="300" width="196" height="58" fill="none" rx="6"/>
  </g>
  <g class="ink" fill="currentColor" font-size="13.5" text-anchor="middle">
    <text x="420" y="158">Forward-sensing</text><text x="420" y="176">fusion</text>
    <text x="420" y="242">Target</text><text x="420" y="260">selection</text>
    <text x="420" y="326">Longitudinal</text><text x="420" y="344">control law</text>
    <text x="650" y="158">State</text><text x="650" y="176">manager</text>
    <text x="650" y="242">Fault</text><text x="650" y="260">manager</text>
    <text x="650" y="326">HMI</text><text x="650" y="344">arbitration</text>
  </g>

  <!-- internal wiring -->
  <g stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" fill="none" marker-end="url(#f1-arrow)">
    <path class="struct" d="M 420 190 L 420 216"/>
    <path class="struct" d="M 420 274 L 420 300"/>
    <path class="struct" d="M 518 161 L 552 161"/>
    <path class="struct" d="M 518 245 L 552 245"/>
    <path class="struct" d="M 650 190 L 650 216"/>
    <path class="struct" d="M 650 274 L 650 300"/>
    <path class="struct" d="M 552 329 L 518 329"/>
    <path class="struct" d="M 650 190 L 650 216"/>
  </g>
  <text class="ink" x="424" y="207" fill="currentColor" fill-opacity="0.75" font-size="11.5">tracks</text>
  <text class="ink" x="424" y="291" fill="currentColor" fill-opacity="0.75" font-size="11.5">target_id</text>
  <text class="ink" x="654" y="207" fill="currentColor" fill-opacity="0.75" font-size="11.5">sensor_health</text>
  <text class="ink" x="654" y="291" fill="currentColor" fill-opacity="0.75" font-size="11.5">acc_state</text>

  <!-- external input blocks -->
  <g stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5">
    <rect class="boxfill struct" x="34" y="132" width="180" height="46" fill="none" rx="6"/>
    <rect class="boxfill struct" x="34" y="196" width="180" height="46" fill="none" rx="6"/>
    <rect class="boxfill struct" x="34" y="272" width="180" height="64" fill="none" rx="6"/>
    <rect class="boxfill struct" x="34" y="380" width="180" height="64" fill="none" rx="6"/>
  </g>
  <g class="ink" fill="currentColor" font-size="13.5" text-anchor="middle">
    <text x="124" y="161">Radar sensor</text>
    <text x="124" y="225">Camera sensor</text>
    <text x="124" y="298">Vehicle bus</text><text x="124" y="318" font-size="11.5">wheel speed, yaw rate, pedals</text>
    <text x="124" y="406">HMI inputs</text><text x="124" y="426" font-size="11.5">set / resume / cancel / gap</text>
  </g>

  <!-- input arrows -->
  <g fill="none" stroke-width="1.6">
    <path class="struct" stroke="currentColor" stroke-opacity="0.65" d="M 214 155 L 322 150" marker-end="url(#f1-arrow)"/>
    <path class="struct" stroke="currentColor" stroke-opacity="0.65" d="M 214 219 L 322 172" marker-end="url(#f1-arrow)"/>
    <path class="struct" stroke="currentColor" stroke-opacity="0.65" d="M 214 304 L 322 245" marker-end="url(#f1-arrow)"/>
    <path stroke="#3B82F6" d="M 214 412 L 322 330" marker-end="url(#f1-arrow-ego)"/>
  </g>
  <g class="ink" fill="currentColor" font-size="11.5">
    <text x="222" y="140">radar_tracks</text>
    <text x="222" y="204">camera_objects</text>
    <text x="222" y="262">v_ego [m/s], yaw_rate [°/s]</text>
    <text x="222" y="278">accel_pedal_pos [%]</text>
    <text x="222" y="360">brake_pedal_switch [bool]</text>
    <text x="222" y="376">cancel_switch [bool], ignition [bool]</text>
  </g>

  <!-- external output blocks -->
  <g stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5">
    <rect class="boxfill struct" x="900" y="132" width="188" height="46" fill="none" rx="6"/>
    <rect class="boxfill struct" x="900" y="204" width="188" height="46" fill="none" rx="6"/>
    <rect class="boxfill struct" x="900" y="276" width="188" height="46" fill="none" rx="6"/>
    <rect class="boxfill struct" x="900" y="348" width="188" height="46" fill="none" rx="6"/>
  </g>
  <g class="ink" fill="currentColor" font-size="13.5" text-anchor="middle">
    <text x="994" y="161">Brake actuator</text>
    <text x="994" y="233">Powertrain actuator</text>
    <text x="994" y="305">Brake-light control</text>
    <text x="994" y="377">HMI display</text>
  </g>

  <!-- output arrows -->
  <g fill="none" stroke-width="1.6">
    <path stroke="#3B82F6" d="M 748 322 L 900 155" marker-end="url(#f1-arrow-ego)"/>
    <path stroke="#3B82F6" d="M 748 336 L 900 227" marker-end="url(#f1-arrow-ego)"/>
    <path stroke="#F59E0B" d="M 770 344 L 900 299" marker-end="url(#f1-arrow)"/>
    <path stroke="#10B981" d="M 770 352 L 900 371" marker-end="url(#f1-arrow-ok)"/>
  </g>
  <g class="ink" fill="currentColor" font-size="11.5">
    <text x="786" y="228">a_x_cmd_acc [m/s^2]</text>
    <text x="786" y="284">brake_light [bool]</text>
    <text x="786" y="392">acc_state, v_set [m/s],</text>
    <text x="786" y="408">gap_setting, target_detected</text>
  </g>

  <!-- outside actors -->
  <g stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="6 4">
    <rect class="struct" x="34" y="492" width="180" height="50" fill="none" rx="6"/>
    <rect class="struct" x="34" y="564" width="180" height="50" fill="none" rx="6"/>
    <rect class="struct" x="820" y="470" width="268" height="66" fill="none" rx="6"/>
  </g>
  <g class="ink" fill="currentColor" font-size="13.5" text-anchor="middle">
    <text x="124" y="522">Driver (outside)</text>
    <text x="124" y="594">Target vehicle (outside)</text>
    <text x="954" y="494">Autonomous emergency braking</text>
    <text x="954" y="514" font-size="11.5">separate system, shares the brake actuator</text>
  </g>
  <g fill="none" stroke-width="1.6">
    <path class="struct" stroke="currentColor" stroke-opacity="0.65" d="M 124 492 L 124 444" marker-end="url(#f1-arrow)"/>
    <path class="struct" stroke="currentColor" stroke-opacity="0.65" d="M 124 564 L 124 340" stroke-dasharray="4 4"/>
    <path stroke="#EF4444" d="M 820 500 L 748 420 L 700 420 L 700 358" marker-end="url(#f1-arrow-fault)"/>
    <path stroke="#EF4444" d="M 954 470 L 954 178" stroke-dasharray="5 4" marker-end="url(#f1-arrow-fault)"/>
  </g>
  <text class="ink" x="132" y="470" fill="currentColor" fill-opacity="0.75" font-size="11.5">commands</text>
  <text class="ink" x="132" y="560" fill="currentColor" fill-opacity="0.75" font-size="11.5">sensed by radar and camera</text>
  <text class="ink" x="706" y="440" fill="#EF4444" font-size="11.5">aeb_brake_request [bool]</text>
  <text class="ink" x="962" y="440" fill="#EF4444" font-size="11.5">AEB brake demand</text>

  <!-- requirement annotations -->
  <g class="ink" font-size="12" font-weight="bold">
    <text x="222" y="292" fill="#3B82F6">ACC-SYS-FUN-041</text>
    <text x="222" y="340" fill="#3B82F6">ACC-SYS-FUN-042</text>
    <text x="786" y="424" fill="#10B981">ACC-SYS-FUN-060</text>
    <text x="786" y="268" fill="#F59E0B">ACC-SYS-FUN-061</text>
    <text x="326" y="128" fill="#EF4444">ACC-SYS-SAF-001</text>
    <text x="222" y="246" fill="#EF4444">ACC-SYS-SAF-002</text>
    <text x="786" y="212" fill="#EF4444">ACC-SYS-SAF-003 · ACC-SYS-SAF-040</text>
    <text x="556" y="292" fill="#EF4444">ACC-SYS-SAF-004</text>
    <text x="556" y="128" fill="#EF4444">ACC-SYS-SAF-021</text>
    <text x="706" y="456" fill="#EF4444">ACC-SYS-SAF-041</text>
  </g>

  <!-- legend -->
  <rect class="struct" x="300" y="596" width="470" height="140" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" rx="8"/>
  <text class="ink" x="316" y="620" fill="currentColor" font-size="14" font-weight="bold">Legend</text>
  <g stroke-width="3">
    <line x1="318" y1="640" x2="352" y2="640" stroke="#3B82F6"/>
    <line x1="318" y1="662" x2="352" y2="662" stroke="#F59E0B"/>
    <line x1="318" y1="684" x2="352" y2="684" stroke="#10B981"/>
    <line x1="318" y1="706" x2="352" y2="706" stroke="#EF4444"/>
    <line x1="318" y1="728" x2="352" y2="728" stroke="currentColor" stroke-opacity="0.65"/>
  </g>
  <g class="ink" fill="currentColor" font-size="12.5">
    <text x="362" y="645">subject-vehicle longitudinal command path</text>
    <text x="362" y="667">target-related and discrete-output path</text>
    <text x="362" y="689">nominal driver-information path</text>
    <text x="362" y="711">fault, health and inter-system arbitration path</text>
    <text x="362" y="733">structural connection or sensing relation</text>
  </g>
</svg>
