name: mongo-sink
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Topic to consume test data uploads from
    defaultValue: test-data-uploads
    required: true
  - name: MONGO_URI
    inputType: FreeText
    description: MongoDB connection URI for the testmanager database
    defaultValue: "mongodb://admin:mongo_password@mongodb:27017/testmanager?authSource=admin"
    required: true
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
