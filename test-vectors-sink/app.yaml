name: test-vectors-sink
language: python
variables:
  - name: input_pt_can
    inputType: InputTopic
    description: PT_CAN_100Hz rows, sunk to acc_pt_can_100hz
    defaultValue: test-vectors-pt-can-100hz
    required: true
  - name: input_radar_obj
    inputType: InputTopic
    description: RADAR_OBJ_50Hz rows, sunk to acc_radar_obj_50hz
    defaultValue: test-vectors-radar-obj-50hz
    required: true
  - name: input_hmi
    inputType: InputTopic
    description: ACC_HMI_10Hz rows, sunk to acc_hmi_10hz
    defaultValue: test-vectors-hmi-10hz
    required: true
  - name: input_sim_ref
    inputType: InputTopic
    description: SIM_REF_100Hz rows, sunk to acc_sim_ref_100hz
    defaultValue: test-vectors-sim-ref-100hz
    required: true
  - name: CONSUMER_GROUP
    inputType: FreeText
    description: Kafka consumer group name
    defaultValue: "test-vectors-sink"
    required: false
  - name: AUTO_OFFSET_RESET
    inputType: Options
    description: >-
      Where to start consuming if no offset exists. Must be earliest, otherwise a fresh
      deployment silently skips every row already on the topic.
    defaultValue: "earliest"
    required: false
  - name: BATCH_SIZE
    inputType: FreeText
    description: Messages per checkpoint. Safe to keep high; these messages are already rows.
    defaultValue: "1000"
    required: false
  - name: COMMIT_INTERVAL
    inputType: FreeText
    description: Kafka commit interval in seconds
    defaultValue: "30"
    required: false
  - name: AUTO_DISCOVER
    inputType: Options
    description: Register the table in the REST catalog on first write
    defaultValue: "true"
    required: false
  - name: CATALOG_NAMESPACE
    inputType: FreeText
    description: Catalog namespace for table registration
    defaultValue: "default"
    required: false
  - name: MAX_WRITE_WORKERS
    inputType: FreeText
    description: Parallel file writes (partitioning x batch size)
    defaultValue: "10"
    required: false
  - name: LOGLEVEL
    inputType: Options
    description: Application logging level
    defaultValue: "INFO"
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
